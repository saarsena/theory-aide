<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tone Row Checker</title>
<style>
:root {
  --bg:#181818; --panel:#212121; --panel2:#272727; --line:#2e2e2e; --line2:#3a3a3a;
  --text:#d8d8d8; --dim:#888; --dim2:#555; --accent:#ffaa2b; --warn:#e0564f;
  --ok:#6fbf73; --info:#5b9bd5; --purple:#c9a7ff; --h1:#e08f4f; --h2:#5b9bd5;
}
html[data-theme="light"] {
  --bg:#f2f0ec; --panel:#e8e6e2; --panel2:#dedbd7; --line:#cac7c2; --line2:#b0ada8;
  --text:#1c1c1c; --dim:#666; --dim2:#888; --accent:#a06800; --warn:#c02020;
  --ok:#2a7a30; --info:#1855a0; --purple:#6030b0; --h1:#a05010; --h2:#1855a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
       font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.hdr { padding: 10px 14px 0; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.hdr-title { font-size: 15px; font-weight: 600; }
.hdr-sub   { color: var(--dim); font-size: 11px; flex: 1; }
.hdr-btn   { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2);
             border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
.hdr-btn:hover { color: var(--text); }

.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 14px;
        margin-top: 8px; gap: 0; flex-shrink: 0; }
.tab  { padding: 6px 14px; cursor: pointer; font-size: 12px; color: var(--dim);
        border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active      { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }

.pane       { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; }
.pane.active { display: block; }

.section-title { font-size: 11px; font-weight: 600; color: var(--dim);
                 text-transform: uppercase; letter-spacing: .05em; margin-bottom: 7px; }
.section { margin-bottom: 16px; }

/* Row display (the detected P0 as pills) */
.row-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
        min-width: 30px; text-align: center; }
.pill-h1 { background: rgba(224,143,79,.18); color: var(--h1); border: 1px solid rgba(224,143,79,.3); }
.pill-h2 { background: rgba(91,155,213,.15); color: var(--h2); border: 1px solid rgba(91,155,213,.3); }
.pill-pos { font-size: 9px; color: var(--dim2); display: block; text-align: center; margin-top: 1px; }

/* 12×12 matrix */
.matrix-wrap { overflow-x: auto; }
.matrix-tbl { border-collapse: collapse; font-size: 11px; }
.matrix-tbl th { padding: 3px 5px; text-align: center; font-size: 9px; font-weight: 500;
                 color: var(--dim); background: var(--panel2); }
.matrix-tbl td { padding: 3px 5px; text-align: center; min-width: 34px; height: 22px;
                 border: 1px solid var(--line); font-size: 11px; }
.matrix-tbl td.h1 { background: rgba(224,143,79,.10); }
.matrix-tbl td.h2 { background: rgba(91,155,213,.10); }
.matrix-tbl .row-lbl { font-size: 10px; color: var(--dim); padding: 3px 7px;
                       border: none; background: var(--panel2); font-weight: 500; }
.matrix-caption { font-size: 10px; color: var(--dim2); margin-top: 5px; }

/* Interval vector */
.iv-row { display: flex; gap: 6px; }
.iv-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
           padding: 6px 8px; text-align: center; flex: 1; }
.iv-ic   { font-size: 9px; color: var(--dim); }
.iv-val  { font-size: 16px; font-weight: 700; color: var(--accent); }
.iv-name { font-size: 9px; color: var(--dim2); }

/* Hexachord */
.hex-row { display: flex; gap: 10px; margin-bottom: 8px; }
.hex-block { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
             padding: 8px 10px; flex: 1; }
.hex-label { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
.hex-notes { display: flex; gap: 3px; flex-wrap: wrap; }

/* Properties */
.prop-row { display: flex; align-items: center; gap: 10px; padding: 5px 0;
            border-bottom: 1px solid var(--line); font-size: 12px; }
.prop-row:last-child { border-bottom: none; }
.prop-key { color: var(--dim); min-width: 160px; }
.badge-yes { background: rgba(111,191,115,.15); color: var(--ok);
             border: 1px solid rgba(111,191,115,.3); border-radius: 10px; padding: 1px 8px; font-size: 10px; }
.badge-no  { background: var(--panel2); color: var(--dim2);
             border: 1px solid var(--line2); border-radius: 10px; padding: 1px 8px; font-size: 10px; }

/* Sequence tab */
.seq-wrap  { display: flex; flex-wrap: wrap; gap: 3px; }
.seq-pill  { padding: 3px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.seq-seg   { display: flex; align-items: center; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; }
.seg-label { font-size: 10px; color: var(--dim); padding: 2px 6px; background: var(--panel2);
             border-radius: 3px; border: 1px solid var(--line); margin-right: 4px; flex-shrink: 0; }

/* Row form browser */
.form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.form-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
             padding: 5px 7px; font-size: 11px; cursor: pointer; }
.form-card:hover { border-color: var(--accent); }
.form-card .form-label { font-weight: 600; color: var(--accent); font-size: 12px; margin-bottom: 2px; }
.form-card .form-pcs   { color: var(--dim); font-size: 10px; line-height: 1.5; }

.error-msg { color: var(--dim); font-size: 12px; padding: 20px 0; line-height: 1.8; }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">Tone Row Checker</div>
  <div class="hdr-sub" id="sub-line"></div>
  <button class="hdr-btn" id="theme-btn">Light</button>
</div>
<div class="tabs">
  <div class="tab active" data-tab="matrix">Row &amp; Matrix</div>
  <div class="tab" data-tab="properties">Properties</div>
  <div class="tab" data-tab="sequence">Sequence</div>
  <div class="tab" data-tab="forms">All 48 Forms</div>
</div>
<div class="pane active" id="pane-matrix"></div>
<div class="pane"        id="pane-properties"></div>
<div class="pane"        id="pane-sequence"></div>
<div class="pane"        id="pane-forms"></div>

<script>
(function() {
  var KEY = "ta-theme", saved = "light";
  try { saved = localStorage.getItem(KEY) || "light"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var DATA = __TONEROW_JSON__;

document.getElementById("sub-line").textContent =
  esc(DATA.clipName) + " · " + DATA.noteCount + " notes · " +
  (DATA.isComplete ? "Complete row detected" : DATA.detectedRow ? "Partial row (" + DATA.detectedRow.length + "/12 PCs)" : "No row detected");

document.querySelectorAll(".tab").forEach(function(t) {
  t.addEventListener("click", function() {
    document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
    document.querySelectorAll(".pane").forEach(function(x) { x.classList.remove("active"); });
    t.classList.add("active");
    document.getElementById("pane-" + t.dataset.tab).classList.add("active");
  });
});

// Hue per row position (0-11): gradient warm→cool
var POS_COLORS = [
  "#e05050","#e07030","#e0a030","#c8c020","#80c030","#40b060",
  "#30a888","#3090c0","#4070e0","#7050d0","#a040b0","#c03080"
];
function posColor(i) { return POS_COLORS[i % 12] || "#888"; }

// ── Row & Matrix tab ─────────────────────────────────────────────────

(function buildMatrix() {
  var el = document.getElementById("pane-matrix");

  if (!DATA.detectedRow) {
    el.innerHTML = '<div class="error-msg">Not enough distinct pitch classes found to identify a tone row.<br>' +
      'Select a MIDI clip with at least 6 unique pitch classes.<br>' +
      'In twelve-tone music each of the 12 chromatic pitches appears exactly once before any repeats.</div>';
    return;
  }

  var html = "";

  // P0 pills
  html += '<div class="section"><div class="section-title">Detected Prime Row (P0)</div>' +
          '<div class="row-pills">';
  DATA.rowNames.forEach(function(name, i) {
    var cls = i < 6 ? "pill pill-h1" : "pill pill-h2";
    html += '<div class="' + cls + '">' + esc(name) +
            '<span class="pill-pos">' + (i + 1) + '</span></div>';
  });
  html += '</div>';
  if (!DATA.isComplete) {
    html += '<div style="font-size:10px;color:var(--warn);margin-top:5px">' +
            'Row is incomplete: only ' + DATA.detectedRow.length + ' of 12 pitch classes found. ' +
            'Matrix and properties require all 12.</div>';
  }
  html += '</div>';

  if (!DATA.matrix) { el.innerHTML = html; return; }

  // The 12×12 matrix
  html += '<div class="section"><div class="section-title">' +
          '12×12 Matrix &nbsp;·&nbsp; <span style="color:var(--h1)">■</span> H1 (1–6) &nbsp; ' +
          '<span style="color:var(--h2)">■</span> H2 (7–12) &nbsp; ' +
          'Read ← for R forms &nbsp; Read ↑ for RI forms</div>' +
          '<div class="matrix-wrap"><table class="matrix-tbl"><thead><tr>' +
          '<th></th>';

  DATA.matrix.colLabels.forEach(function(lbl) {
    html += '<th>' + esc(lbl) + '</th>';
  });
  html += '</tr></thead><tbody>';

  DATA.matrix.noteNames.forEach(function(row, i) {
    html += '<tr><td class="row-lbl">' + esc(DATA.matrix.rowLabels[i]) + '</td>';
    row.forEach(function(name, j) {
      var cls = j < 6 ? "h1" : "h2";
      html += '<td class="' + cls + '">' + esc(name) + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>' +
          '<div class="matrix-caption">Top row = P0 reading left→right. ' +
          'Left column = I0 reading top→bottom. ' +
          'Rows read right→left give R forms. Columns read bottom→top give RI forms.</div>' +
          '</div></div>';

  el.innerHTML = html;
})();

// ── Properties tab ───────────────────────────────────────────────────

(function buildProperties() {
  var el = document.getElementById("pane-properties");
  if (!DATA.isComplete || !DATA.intervalVector) {
    el.innerHTML = '<div class="error-msg">Complete 12-tone row required for properties.</div>';
    return;
  }

  var html = "";

  // Hexachords
  var hx = DATA.hexachord;
  html += '<div class="section"><div class="section-title">Hexachords</div>' +
          '<div class="hex-row">' +
          '<div class="hex-block">' +
          '<div class="hex-label">H1 &nbsp;·&nbsp; positions 1–6</div>' +
          '<div class="hex-notes">';
  hx.h1Names.forEach(function(n) {
    html += '<span class="pill pill-h1" style="font-size:11px;padding:2px 6px">' + esc(n) + '</span>';
  });
  html += '</div></div><div class="hex-block">' +
          '<div class="hex-label">H2 &nbsp;·&nbsp; positions 7–12</div>' +
          '<div class="hex-notes">';
  hx.h2Names.forEach(function(n) {
    html += '<span class="pill pill-h2" style="font-size:11px;padding:2px 6px">' + esc(n) + '</span>';
  });
  html += '</div></div></div>';

  // Combinatoriality / properties
  html += '<div class="prop-row"><span class="prop-key">H1 and H2 are complementary</span>' +
          '<span class="badge-' + (hx.isComplement ? "yes" : "no") + '">' +
          (hx.isComplement ? "Yes" : "No") + '</span></div>' +

          '<div class="prop-row"><span class="prop-key">I-combinatorial</span>' +
          (hx.iCombinatorial
            ? '<span class="badge-yes">Yes, combine with ' + esc(hx.iCombinatorial) + '</span>'
            : '<span class="badge-no">No</span>') + '</div>' +

          '<div class="prop-row"><span class="prop-key">R-combinatorial (palindromic hexachords)</span>' +
          '<span class="badge-' + (hx.rCombinatorial ? "yes" : "no") + '">' +
          (hx.rCombinatorial ? "Yes" : "No") + '</span></div>';

  html += '</div>';

  // Interval vector
  var IC_NAMES = ["m2 / M7","M2 / m7","m3 / M6","M3 / m6","P4 / P5","TT"];
  var iv = DATA.intervalVector;
  var maxIv = Math.max.apply(null, iv);

  html += '<div class="section"><div class="section-title">Interval Vector</div>' +
          '<div class="iv-row">';
  iv.forEach(function(count, i) {
    html += '<div class="iv-cell">' +
            '<div class="iv-ic">ic' + (i + 1) + '</div>' +
            '<div class="iv-val">' + count + '</div>' +
            '<div class="iv-name">' + esc(IC_NAMES[i]) + '</div>' +
            '</div>';
  });
  html += '</div>';

  // Character note
  var dom = iv.indexOf(maxIv);
  var chars = ["chromatic / stepwise","whole-tone / stepwise","minor-thirds","major-thirds","fourths / fifths","tritone-heavy"];
  html += '<div style="font-size:11px;color:var(--dim);margin-top:7px">' +
          'Strongest interval class: ic' + (dom + 1) + ' (' + esc(IC_NAMES[dom]) + '). ' +
          'Suggests a ' + (chars[dom] || "") + ' character.</div></div>';

  el.innerHTML = html;
})();

// ── Sequence tab ─────────────────────────────────────────────────────

(function buildSequence() {
  var el = document.getElementById("pane-sequence");
  if (!DATA.detectedRow) {
    el.innerHTML = '<div class="error-msg">No row detected. Cannot annotate sequence.</div>';
    return;
  }

  var html = "";

  // If we have segment matches, show them grouped
  if (DATA.segments && DATA.segments.length > 0 && DATA.isComplete) {
    html += '<div class="section"><div class="section-title">Row Form Statements Detected</div>';

    DATA.segments.forEach(function(seg) {
      var complete = seg.matched === 12;
      html += '<div class="seq-seg"><span class="seg-label">' + esc(seg.label) +
              (complete ? '' : ' (' + seg.matched + '/12)') + '</span>';
      seg.pcs.slice(0, seg.matched).forEach(function(pc, i) {
        var pos = i;
        var c = posColor(pos);
        html += '<span class="seq-pill" style="background:' + c + '22;color:' + c +
                ';border:1px solid ' + c + '55">' + esc(DATA.orderedPCNames[seg.startIdx + i] || "?") + '</span>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  // Full ordered PC sequence
  var rowPCset = (DATA.detectedRow || []).map(function(pc) { return pc; });
  html += '<div class="section"><div class="section-title">All Pitch Classes in Order (' +
          DATA.orderedPCs.length + ' events, after collapsing repetitions)</div>' +
          '<div class="seq-wrap">';

  DATA.orderedPCs.forEach(function(pc, idx) {
    var posInRow = rowPCset.indexOf(pc);
    var c = posInRow >= 0 ? posColor(posInRow) : "var(--warn)";
    var name = DATA.orderedPCNames[idx] || "?";
    var title = posInRow >= 0 ? "Position " + (posInRow + 1) + " in P0" : "Not in detected row";
    html += '<span class="seq-pill" title="' + esc(title) + '" ' +
            'style="background:' + c + '22;color:' + c + ';border:1px solid ' + c + '55">' +
            esc(name) + '</span>';
  });
  html += '</div>';

  // Legend
  html += '<div style="margin-top:8px;font-size:10px;color:var(--dim2)">Color = position in P0. ' +
          '<span style="color:var(--warn)">Red</span> = pitch class not in detected row.</div></div>';

  el.innerHTML = html;
})();

// ── All 48 Forms tab ─────────────────────────────────────────────────

(function buildForms() {
  var el = document.getElementById("pane-forms");
  if (!DATA.isComplete || !DATA.allForms48.length) {
    el.innerHTML = '<div class="error-msg">Complete 12-tone row required to generate all forms.</div>';
    return;
  }

  var ORDER = ["P","I","R","RI"];
  var grouped = { P: [], I: [], R: [], RI: [] };
  DATA.allForms48.forEach(function(f) {
    var type = f.label.replace(/\d+/,"");
    if (grouped[type]) grouped[type].push(f);
  });

  var html = "";
  ORDER.forEach(function(type) {
    var forms = grouped[type] || [];
    if (!forms.length) return;
    var fullName = { P: "Prime (P)", I: "Inversion (I)", R: "Retrograde (R)", RI: "Retrograde Inversion (RI)" }[type];
    html += '<div class="section"><div class="section-title">' + esc(fullName) + '</div>' +
            '<div class="form-grid">';
    forms.forEach(function(f) {
      html += '<div class="form-card"><div class="form-label">' + esc(f.label) + '</div>' +
              '<div class="form-pcs">' + f.names.map(function(n) { return esc(n); }).join("  ") + '</div></div>';
    });
    html += '</div></div>';
  });

  el.innerHTML = html;
})();
</script>
</body>
</html>
