<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #181818; --panel: #222; --panel2: #292929; --line: #363636;
    --text: #d8d8d8; --dim: #8c8c8c; --accent: #ffaa2b;
    --vertical: #5b9bd5; --horizontal: #6fbf73; --macro: #e08f4f; --spectral: #b47cff;
  }
  html[data-theme="light"] {
    --bg: #f2f0ec; --panel: #e8e6e2; --panel2: #dedbd7; --line: #c8c4bd;
    --text: #1c1c1c; --dim: #666; --accent: #a06800;
    --vertical: #1855a0; --horizontal: #2a7a30; --macro: #a05010; --spectral: #663399;
  }
  html[data-theme="light"] .content::-webkit-scrollbar-thumb { background: #b8b4ae; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px 20px 12px;
  }
  .hd { flex-shrink: 0; display: flex; align-items: flex-start; gap: 12px; }
  h1 { font-size: 16px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .theme-btn {
    margin-left: auto; background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 10px; cursor: pointer; font-size: 11px;
  }
  .theme-btn:hover { color: var(--text); }
  .overview {
    flex-shrink: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px;
  }
  .focus { color: var(--accent); font-weight: 700; text-transform: capitalize; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill {
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px;
    color: var(--dim); background: var(--panel2); font-size: 11px;
  }
  .content {
    flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px;
    scrollbar-color: var(--line) transparent;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px; min-height: 210px;
  }
  .card.vertical { border-top: 3px solid var(--vertical); }
  .card.horizontal { border-top: 3px solid var(--horizontal); }
  .card.macro { border-top: 3px solid var(--macro); }
  .card.spectral { border-top: 3px solid var(--spectral); }
  .card h2 { font-size: 14px; margin-bottom: 3px; }
  .headline { color: var(--accent); font-size: 12px; margin-bottom: 9px; }
  ul { margin: 0 0 10px 18px; padding: 0; color: #c8c8c8; }
  html[data-theme="light"] ul { color: #404040; }
  li { margin-bottom: 5px; }
  .move {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 9px; color: var(--text);
  }
  .move b { color: var(--accent); }
  .footer { flex-shrink: 0; display: flex; justify-content: flex-end; }
  .close-btn {
    background: #2f2f2f; color: #ddd; border: 1px solid #444;
    border-radius: 4px; padding: 5px 22px; cursor: pointer; font-size: 13px;
  }
  html[data-theme="light"] .close-btn { background: #dedad4; color: var(--text); border-color: #b0ada8; }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="hd">
  <div>
    <h1>Composition Dimensions</h1>
    <div class="sub">See what the idea is changing, then pick the next musical move.</div>
  </div>
  <button class="theme-btn" id="theme-btn">Light</button>
</div>

<div class="overview">
  <div id="summary"></div>
  <div class="meta" id="meta"></div>
</div>

<div class="content">
  <div class="cards" id="cards"></div>
</div>

<div class="footer">
  <button class="close-btn" id="close">Close</button>
</div>

<script>
var DATA = __DIMENSIONS_JSON__;

(function() {
  var KEY = "ta-theme";
  var saved = "light";
  try { saved = localStorage.getItem(KEY) || "light"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function closeDialog() {
  var msg = { method: "close_and_send", params: ["null"] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live)
    window.webkit.messageHandlers.live.postMessage(msg);
  else if (window.chrome && window.chrome.webview)
    window.chrome.webview.postMessage(msg);
}

document.getElementById("close").addEventListener("click", closeDialog);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeDialog(); });

document.getElementById("summary").innerHTML =
  esc(DATA.summary).replace(esc(DATA.primaryChange), '<span class="focus">' + esc(DATA.primaryChange) + '</span>') +
  '<div class="sub" style="margin-top:4px">' + esc(DATA.primaryChangeReason) + '</div>';

document.getElementById("meta").innerHTML = [
  "Key: " + DATA.keyLabel,
  "Range: " + DATA.rangeLabel,
  DATA.noteCount + " notes",
  DATA.trackCount + " tracks"
].map(function(item) {
  return '<span class="pill">' + esc(item) + '</span>';
}).join("");

document.getElementById("cards").innerHTML = DATA.dimensions.map(function(card) {
  return '<section class="card ' + esc(card.id) + '">' +
    '<h2>' + esc(card.title) + '</h2>' +
    '<div class="headline">' + esc(card.headline) + '</div>' +
    '<ul>' + card.observations.map(function(item) {
      return '<li>' + esc(item) + '</li>';
    }).join("") + '</ul>' +
    '<div class="move"><b>Next move:</b> ' + esc(card.nextMove) + '</div>' +
  '</section>';
}).join("");
</script>
</body>
</html>
