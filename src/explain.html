<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:      #181818;
    --panel:   #212121;
    --panel2:  #272727;
    --line:    #2e2e2e;
    --line2:   #3a3a3a;
    --text:    #d8d8d8;
    --dim:     #888;
    --dim2:    #606060;
    --accent:  #ffaa2b;
    --warn:    #e0564f;
    --tonic:   #5b9bd5;
    --subdom:  #6fbf73;
    --dom:     #e08f4f;
    --borrow:  #c9a7ff;
    --second:  #8fc1ff;
  }
  html[data-theme="light"] {
    --bg:      #f2f0ec;
    --panel:   #e8e6e2;
    --panel2:  #dedbd7;
    --line:    #cac7c2;
    --line2:   #b0ada8;
    --text:    #1c1c1c;
    --dim:     #666;
    --dim2:    #888;
    --accent:  #a06800;
    --warn:    #c02020;
    --tonic:   #1855a0;
    --subdom:  #2a7a30;
    --dom:     #a05010;
    --borrow:  #6030b0;
    --second:  #1848a8;
  }
  html[data-theme="light"] .mode-btn.active     { background: #fff3d0; }
  html[data-theme="light"] .card.active          { background: #fff8e8; }
  html[data-theme="light"] .snote.root           { background: #fff3c8; border-color: #c89010; }
  html[data-theme="light"] .pill.borrowed        { background: #ede8ff; }
  html[data-theme="light"] .pill.secondary       { background: #e8f0ff; }
  html[data-theme="light"] .teach-p              { color: #404040; }
  html[data-theme="light"] .teach-callout        { color: #404040; }
  html[data-theme="light"] .teach-callout.borrow { background: #f4f0ff; }
  html[data-theme="light"] .teach-callout.second { background: #eef3ff; }
  html[data-theme="light"] button#close          { background: #dedad4; }
  html[data-theme="light"] button#close:hover    { background: #d0ccc6; }
  html[data-theme="light"] .narrative::-webkit-scrollbar-thumb              { background: #b8b4ae; }
  html[data-theme="light"] body.teach-mode .detail::-webkit-scrollbar-thumb { background: #b8b4ae; }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; min-height: 0; }
  body {
    height: 100%;
    min-height: 0;
    background: var(--bg);
    color: var(--text);
    font: 12.5px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 12px;
    gap: 10px;
    overflow: hidden;
  }

  /* ── Header ── */
  .hd { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .hd-top { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden;
       text-overflow: ellipsis; }
  .sub { color: var(--dim); font-size: 11px; }
  .keybadges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .keybadge {
    background: var(--panel); border: 1px solid var(--line2); border-radius: 4px;
    padding: 2px 8px; font-size: 11px;
  }
  .keybadge b { color: var(--accent); font-weight: 600; }
  .mismatch { color: var(--warn); }

  /* ── Theme toggle button ── */
  .theme-btn {
    background: transparent; border: 1px solid var(--line2);
    border-radius: 4px; padding: 3px 10px; font-size: 11px;
    cursor: pointer; color: var(--dim); flex-shrink: 0;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--dim); }

  /* ── Mode toggle ── */
  .mode-toggle {
    display: flex; background: var(--panel); border: 1px solid var(--line2);
    border-radius: 4px; padding: 2px; gap: 1px; flex-shrink: 0;
  }
  .mode-btn {
    padding: 3px 13px; border-radius: 3px; font-size: 11px;
    cursor: pointer; color: var(--dim); background: transparent;
    border: none; white-space: nowrap;
  }
  .mode-btn.active { background: #251e10; color: var(--accent); }
  .mode-btn:hover:not(.active) { color: var(--text); }

  /* Scale note pills */
  .scalenotes { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
  .snote {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 7px; font-size: 11px; color: var(--dim);
  }
  .snote.root { background: #302800; border-color: #5c4a00; color: var(--accent); font-weight: 600; }

  /* ── Chord card strip ── */
  .cards-outer {
    display: flex; flex-direction: column; gap: 6px;
    flex: 0 0 auto; max-height: 150px; min-height: 0;
  }
  .cards {
    display: flex; flex-wrap: wrap; gap: 6px;
    max-height: 116px; min-height: 0; overflow-y: auto;
    padding-right: 4px; scrollbar-color: var(--line2) transparent;
  }
  .cards::-webkit-scrollbar { width: 6px; }
  .cards::-webkit-scrollbar-track { background: transparent; }
  .cards::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 10px 7px 13px; min-width: 80px; max-width: 170px;
    flex: 1 1 92px; max-height: 104px; overflow: hidden; position: relative;
    cursor: pointer; user-select: none; transition: border-color 0.1s;
  }
  .card:hover { border-color: var(--line2); }
  .card.active { border-color: var(--accent); background: #251e10; }
  .card.clash { border-color: var(--warn); }
  .card.active.clash { border-color: var(--warn); }
  .card .fnbar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 5px 0 0 5px;
  }
  .fn-tonic    { background: var(--tonic); }
  .fn-subdominant { background: var(--subdom); }
  .fn-dominant { background: var(--dom); }
  .card .cname { font-size: 14px; font-weight: 600; }
  .card .roman { color: var(--accent); font-size: 12px; margin-top: 1px; }
  .card .beats { color: var(--dim2); font-size: 10px; margin-top: 4px; }
  .pill {
    display: inline-block; border-radius: 3px; padding: 0 5px;
    font-size: 10px; margin-top: 4px; margin-right: 2px;
  }
  .pill.borrowed  { background: #2d1f44; color: var(--borrow); }
  .pill.secondary { background: #1a2a3a; color: var(--second); }
  .warnline { color: var(--warn); font-size: 10px; margin-top: 3px; }
  .infoline { color: var(--dim); font-size: 10px; margin-top: 3px; }
  .card .warnline,
  .card .infoline {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Pagination ── */
  .pg {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 6px; align-self: flex-start;
  }
  .pg-btn {
    background: transparent; border: none; color: var(--dim);
    font-size: 14px; cursor: pointer; padding: 0 4px; border-radius: 2px;
  }
  .pg-btn:hover:not(:disabled) { background: var(--line); color: var(--text); }
  .pg-btn:disabled { opacity: 0.3; cursor: default; }
  .pg-info { font-size: 10.5px; color: var(--dim2); min-width: 60px; text-align: center; }

  /* ── Detail panel ── */
  .detail {
    flex: 0 1 190px;
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px;
    padding: 11px 13px 10px;
    min-height: 96px; max-height: 32vh;
    overflow-y: auto;
    scrollbar-color: var(--line2) transparent;
  }
  .detail::-webkit-scrollbar { width: 6px; }
  .detail::-webkit-scrollbar-track { background: transparent; }
  .detail::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .detail-empty { color: var(--dim); font-size: 12px; }
  .detail-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .detail-cname { font-size: 15px; font-weight: 600; }
  .detail-roman { color: var(--accent); font-size: 13px; }
  .detail-fn {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto;
    border: 1px solid var(--line2); color: var(--dim);
  }
  .detail-fn.fn-tonic    { border-color: var(--tonic);  color: var(--tonic); }
  .detail-fn.fn-subdominant { border-color: var(--subdom); color: var(--subdom); }
  .detail-fn.fn-dominant { border-color: var(--dom);    color: var(--dom); }

  .spell {
    display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 7px;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .tone {
    display: flex; flex-direction: column; align-items: center;
    padding: 5px 10px; border-right: 1px solid var(--line);
    min-width: 60px;
  }
  .tone:last-child { border-right: none; }
  .tone .tname { font-size: 14px; font-weight: 600; }
  .tone .tiv {
    font-size: 10px; color: var(--dim); margin-top: 2px;
    white-space: nowrap;
  }
  .tone .tiv.tritone { color: var(--dom); font-weight: 600; }
  .tone .tiv.leading { color: var(--borrow); }

  /* Analysis mode text */
  .qdesc {
    font-size: 12px; color: var(--text); line-height: 1.5;
    margin-bottom: 5px;
  }
  .fdesc { font-size: 11px; color: var(--dim); line-height: 1.5; margin-bottom: 5px; }
  .special {
    font-size: 11px; color: var(--dim); line-height: 1.5;
    border-left: 2px solid var(--line2); padding-left: 8px; margin-top: 4px;
  }
  .special.borrowed-note { border-color: var(--borrow); }
  .special.secondary-note { border-color: var(--second); }

  /* ── Teaching mode styles ── */
  body.teach-mode .detail {
    flex: 1;
    min-height: 0;
    max-height: none;
    overflow-y: auto;
  }
  body.teach-mode .detail::-webkit-scrollbar { width: 6px; }
  body.teach-mode .detail::-webkit-scrollbar-track { background: transparent; }
  body.teach-mode .detail::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  body.teach-mode .narrative { display: none; }

  .teach-section { margin-bottom: 12px; }
  .teach-section:last-child { margin-bottom: 0; }
  .teach-tag {
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--dim2); margin-bottom: 5px;
  }
  .teach-p {
    font-size: 12px; color: #bfbfbf; line-height: 1.72;
  }
  .teach-p strong { color: var(--text); font-weight: 600; }
  .teach-p + .teach-p { margin-top: 6px; }
  .teach-callout {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px 11px; font-size: 11.5px;
    color: #bbb; line-height: 1.65; margin-top: 8px;
  }
  .teach-callout.borrow { border-left: 3px solid var(--borrow); }
  .teach-callout.second { border-left: 3px solid var(--second); }
  .teach-callout strong { color: var(--text); }

  /* ── Narrative ── */
  .narrative {
    flex: 1; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 9px 12px;
    overflow-y: auto;
    scrollbar-color: var(--line2) transparent;
  }
  .narrative::-webkit-scrollbar { width: 6px; }
  .narrative::-webkit-scrollbar-track { background: transparent; }
  .narrative::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .narrative-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--dim2); margin-bottom: 6px;
  }
  .narrative-text { font-size: 12px; line-height: 1.65; color: var(--dim); }
  .narrative-text b { color: var(--text); font-weight: 600; }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .legend { display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--dim2); }
  .legend i {
    display: inline-block; width: 7px; height: 7px; border-radius: 2px;
    margin: 0 3px 0 8px;
  }
  .cands { font-size: 10px; color: var(--dim2); }
  button#close {
    background: #2a2a2a; color: var(--text); border: 1px solid var(--line2);
    border-radius: 4px; padding: 5px 20px; cursor: pointer; font-size: 12px;
    flex-shrink: 0;
  }
  button#close:hover { background: #333; }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-top">
    <h1 id="title">Explain Harmony</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="theme-btn" id="theme-btn">Light</button>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-analysis">Analysis</button>
        <button class="mode-btn"        id="btn-teach">Teach Me</button>
      </div>
    </div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="keybadges" id="keybadges"></div>
</div>

<div class="scalenotes" id="scalenotes"></div>
<div class="cards-outer">
  <div class="cards" id="cards"></div>
  <div class="pg" id="pg" style="display:none">
    <button class="pg-btn" id="pg-prev">&lsaquo;</button>
    <span class="pg-info" id="pg-info">Page 1 of 1</span>
    <button class="pg-btn" id="pg-next">&rsaquo;</button>
  </div>
</div>
<div class="detail" id="detail"><div class="detail-empty">Click a chord to learn about it.</div></div>
<div class="narrative" id="narrative"></div>

<div class="footer">
  <div>
    <div class="legend">
      Function:
      <i style="background:var(--tonic)"></i>tonic
      <i style="background:var(--subdom)"></i>subdominant
      <i style="background:var(--dom)"></i>dominant
    </div>
    <div class="cands" id="cands"></div>
  </div>
  <button id="close">Close</button>
</div>

<script>
var DATA = __EXPLAIN_JSON__;
var teachMode = false;
var selectedIdx = -1;
var currentPage = 0;
var pageSize = 8;

// ── Theme toggle ──────────────────────────────────────────────────────────
(function() {
  var KEY = "ta-theme";
  var saved = "light";
  try { saved = localStorage.getItem(KEY) || "dark"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

// ── Close ──────────────────────────────────────────────────────────────────
function closeDialog() {
  var msg = { method: "close_and_send", params: ["null"] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live)
    window.webkit.messageHandlers.live.postMessage(msg);
  else if (window.chrome && window.chrome.webview)
    window.chrome.webview.postMessage(msg);
}
document.getElementById("close").addEventListener("click", closeDialog);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeDialog(); });

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// ── Mode toggle ────────────────────────────────────────────────────────────
document.getElementById("btn-analysis").addEventListener("click", function() { setMode("analysis"); });
document.getElementById("btn-teach").addEventListener("click",    function() { setMode("teach"); });

function setMode(mode) {
  teachMode = mode === "teach";
  document.getElementById("btn-analysis").classList.toggle("active", !teachMode);
  document.getElementById("btn-teach").classList.toggle("active",     teachMode);
  document.body.classList.toggle("teach-mode", teachMode);
  if (selectedIdx >= 0 && DATA.segments[selectedIdx]) {
    renderCurrentDetail(DATA.segments[selectedIdx]);
  }
}

function renderCurrentDetail(s) {
  if (teachMode) renderTeachDetail(s);
  else renderAnalysisDetail(s);
}

// ── Theory vocabulary ──────────────────────────────────────────────────────
var INTERVAL_LABELS = {
  0:  { short: "root",   long: "root" },
  1:  { short: "♭2",    long: "minor 2nd (♭2)" },
  2:  { short: "2",      long: "major 2nd" },
  3:  { short: "♭3",    long: "minor 3rd (♭3)", flag: "minor-color" },
  4:  { short: "3",      long: "major 3rd", flag: "major-color" },
  5:  { short: "4",      long: "perfect 4th" },
  6:  { short: "♭5",    long: "tritone (♭5)", flag: "tritone" },
  7:  { short: "5",      long: "perfect 5th" },
  8:  { short: "♯5",    long: "augmented 5th (♯5)", flag: "tritone" },
  9:  { short: "6",      long: "major 6th" },
  10: { short: "♭7",    long: "minor 7th (♭7)", flag: "leading" },
  11: { short: "7",      long: "major 7th", flag: "leading" },
  12: { short: "8",      long: "octave" },
  14: { short: "9",      long: "major 9th" },
};

var QUALITY_DESC = {
  "major":       "Bright and stable. The major 3rd gives it an uplifting, resolved character.",
  "minor":       "Dark and stable. The minor 3rd creates an introspective, melancholic quality, but still grounded.",
  "dominant7":   "Tense and directional. The tritone between the 3rd and ♭7th creates an intense pull toward resolution a perfect 5th down.",
  "major7":      "Lush and sophisticated. The major 7th (one semitone below the octave) adds a floating color: tension without urgency.",
  "minor7":      "Mellow and jazzy. A minor chord softened by the ♭7th: common in jazz, soul, and R&B.",
  "diminished":  "Very tense. Two interlocking tritones make this chord unstable from every angle: it needs to move.",
  "half-dim7":   "Half-diminished (ø7). Tense but less brittle than a full dim7. Typically used as iiø7 in minor keys or as a passing chord.",
  "dim7":        "Maximally symmetric tension. Every interval is equal (3 semitones apart), producing cascading tritones. Resolves ambiguously in any direction.",
  "augmented":   "Ambiguous and unresolved. The augmented 5th (♯5) splits the octave into two equal major 3rds: no clear resolution direction.",
  "sus2":        "Open and neutral. Replaces the 3rd with a 2nd: neither major nor minor. Often resolves by moving to the 3rd.",
  "sus4":        "Suspended. The 4th leans downward toward the major 3rd, implying motion. Classic in rock builds.",
  "major6":      "Warm and slightly jazzy. The added 6th softens the brightness of the major chord.",
  "minor6":      "Bittersweet. The natural 6th on a minor chord creates a distinctive tension: characteristic of jazz minor harmony.",
  "major9":      "Rich and expansive. The 9th extends the major 7th chord one step further into color territory.",
  "minor9":      "Deep and cinematic. The 9th adds color above the minor 7th without changing its melancholic core.",
  "dominant9":   "Dominant energy with added color. The 9th enriches the V7 sound while preserving its pull to resolution.",
  "add9":        "Bright with texture. A major chord plus the 9th: no 7th, so it retains the major triad's clarity.",
  "minor11":     "Wide and open. A minor 7th chord with 9th and 11th colors, common in modal, jazz, soul, and cinematic harmony.",
  "dominant11":  "Dominant tension with a suspended upper color. The 11th adds width while the 3rd and 7th keep the dominant pull active.",
  "major13":     "Expansive and polished. A major 7th color extended up to the 13th for a smooth jazz or fusion sound.",
  "minor13":     "Dark but spacious. A minor 7th color with the 13th added for a more modern, less closed minor sound.",
  "dominant13":  "Dominant pull with a bright 13th on top. Common in jazz, funk, soul, and gospel dominant chords.",
  "dominant7sus4": "Suspended dominant. It keeps the dominant 7th tension but replaces the 3rd with the 4th, delaying the resolution.",
};

var FN_DESC = {
  "tonic":       "Tonic function: this is home. The ear hears it as a resting point, a place of arrival.",
  "subdominant": "Subdominant function: creates gentle motion away from the tonic. Sets the stage for the dominant or returns directly home.",
  "dominant":    "Dominant function: maximum harmonic tension. The ear expects this to resolve down a perfect 5th to the tonic.",
};

var DEGREE_DESC = {
  "I":    "The tonic: home base. The most stable chord in the key; where progressions want to begin and end.",
  "II":   "The supertonic (ii). Almost always moves to V: the ii to V motion is ubiquitous in jazz and classical music. Subdominant function.",
  "III":  "The mediant (iii). A tonic substitute: shares two notes with I. Often used as a passing chord between I and IV.",
  "IV":   "The subdominant. Creates departure from the tonic. Both the plagal direction (IV→I) and the pre-dominant direction (IV→V) are common.",
  "V":    "The dominant: the primary tension chord. Its pull back to I is the driving force of tonal harmony. With a 7th, it becomes even more directional.",
  "VI":   "The submediant (vi). The relative minor: shares two notes with I and IV, making it a versatile tonic substitute with a darker color.",
  "VII":  "The leading tone chord. Built on the 7th scale degree, which is one semitone below the octave and strongly wants to resolve upward to the tonic.",
};

// ── Helpers ────────────────────────────────────────────────────────────────
function beatLabel(s) {
  var b = Math.round(s.start);
  var e = Math.round(s.end);
  if (e - b <= 1) return "beat " + (b + 1);
  return "beats " + (b + 1) + " to " + e;
}

function hasHardWarning(s) {
  return !!(s.outliers && s.outliers.some(function(o) { return o.severity === "warn"; }));
}

function extractBaseDegree(label) {
  if (!label) return null;
  var m = label.match(/^[b#♭♯]*(VII|VI|IV|V|III|II|I)/i);
  return m ? m[1].toUpperCase() : null;
}

function extractSecondaryTarget(label) {
  var slash = label ? label.indexOf("/") : -1;
  return slash !== -1 ? label.slice(slash + 1) : null;
}

// ── Shared interval spell row ──────────────────────────────────────────────
function buildSpellHtml(s) {
  var tones = s.chordToneNames || s.pcNames || [];
  var ivs   = s.intervals || [];
  var html  = '<div class="spell">';
  for (var i = 0; i < tones.length; i++) {
    var iv   = ivs[i] !== undefined ? ivs[i] : -1;
    var info = INTERVAL_LABELS[iv] || { short: iv+"st", long: iv+" semitones", flag: "" };
    var fc   = info.flag ? " " + info.flag : "";
    html += '<div class="tone">' +
      '<span class="tname">' + esc(tones[i]) + '</span>' +
      '<span class="tiv' + fc + '">' + esc(info.long) + '</span>' +
      '</div>';
  }
  return html + '</div>';
}

// ── Scale notes header ─────────────────────────────────────────────────────
(function renderScale() {
  var root      = DATA.key.root;
  var noteNames = DATA.scaleNoteNames || [];
  var scalePCs  = DATA.scaleNotes || [];
  var el  = document.getElementById("scalenotes");
  var html = '<span style="color:var(--dim2);font-size:11px;margin-right:6px">Scale:</span>';
  for (var i = 0; i < noteNames.length; i++) {
    html += '<span class="snote' + (scalePCs[i] === root ? ' root' : '') + '">' +
            esc(noteNames[i]) + '</span>';
  }
  el.innerHTML = html;
})();

// ── Chord cards ────────────────────────────────────────────────────────────
function renderCards() {
  var total = DATA.segments.length;
  var pageCount = Math.ceil(total / pageSize);
  if (currentPage >= pageCount) currentPage = Math.max(0, pageCount - 1);

  var pgEl = document.getElementById("pg");
  if (pageCount > 1) {
    pgEl.style.display = "flex";
    document.getElementById("pg-info").textContent = "Page " + (currentPage + 1) + " of " + pageCount;
    document.getElementById("pg-prev").disabled = currentPage === 0;
    document.getElementById("pg-next").disabled = currentPage === pageCount - 1;
  } else {
    pgEl.style.display = "none";
  }

  var container = document.getElementById("cards");
  container.innerHTML = "";
  
  var start = currentPage * pageSize;
  var end = Math.min(start + pageSize, total);
  var pageSegments = DATA.segments.slice(start, end);

  pageSegments.forEach(function(s, pi) {
    var i = start + pi;
    var div = document.createElement("div");
    var cls = "card";
    if (hasHardWarning(s)) cls += " clash";
    if (i === selectedIdx) cls += " active";
    div.className = cls;

    var html = "";
    if (s.fn) html += '<div class="fnbar fn-' + s.fn + '"></div>';
    html += '<div class="cname">' + esc(s.chordName || "None") + "</div>";
    if (s.roman) html += '<div class="roman">' + esc(s.roman.label) + "</div>";
    html += '<div class="beats">' + esc(beatLabel(s)) + "</div>";
    if (s.roman && s.roman.borrowed)  html += '<span class="pill borrowed">borrowed</span>';
    if (s.roman && s.roman.secondary) html += '<span class="pill secondary">2° dom.</span>';
    if (s.outliers) s.outliers.forEach(function(o) {
      var cls = o.severity === "warn" ? "warnline" : "infoline";
      html += '<div class="' + cls + '">' + esc(o.name) + ' · ' +
        esc(o.explanation || 'Outside the key.') + '</div>';
    });
    div.innerHTML = html;

    div.addEventListener("click", function() {
      selectedIdx = i;
      renderCards();
      renderCurrentDetail(s);
    });
    container.appendChild(div);
  });
}

document.getElementById("pg-prev").addEventListener("click", function() {
  if (currentPage > 0) {
    currentPage--;
    renderCards();
  }
});
document.getElementById("pg-next").addEventListener("click", function() {
  if (currentPage < Math.ceil(DATA.segments.length / pageSize) - 1) {
    currentPage++;
    renderCards();
  }
});

// ANALYSIS DETAIL MODE
// ══════════════════════════════════════════════════════════════════════════════
function renderAnalysisDetail(s) {
  var el = document.getElementById("detail");
  if (!s || !s.chordName) {
    el.innerHTML = '<div class="detail-empty">No chord detected in this segment.</div>';
    return;
  }

  var qDesc  = QUALITY_DESC[s.quality] || "";
  var isSecondary = !!(s.roman && s.roman.secondary);
  var isBorrowed = !!(s.roman && s.roman.borrowed);
  var isSpecialRoman = isSecondary || isBorrowed;
  var fnDesc = !isSpecialRoman && s.fn ? FN_DESC[s.fn] : "";
  var baseDeg = s.roman ? extractBaseDegree(s.roman.label) : null;
  var degDesc = !isSpecialRoman && baseDeg ? (DEGREE_DESC[baseDeg] || "") : "";

  var specialHtml = "";
  if (s.roman && s.roman.borrowed) {
    specialHtml =
      '<div class="special borrowed-note">' +
      '<b>Modal interchange:</b> Borrowed from the parallel ' +
      (DATA.key.scaleName === "major" ? "minor" : "major") +
      ' key. Swapping in chords from the parallel mode adds darker or brighter color without fully leaving the key.' +
      '</div>';
  } else if (isSecondary) {
    var tgt = extractSecondaryTarget(s.roman.label);
    specialHtml =
      '<div class="special secondary-note">' +
      '<b>Secondary dominant:</b> A V7 applied to ' + esc(tgt || "a non-tonic degree") +
      '. Temporarily treats ' + esc(tgt || "that chord") +
      ' as a local tonic: a brief detour that adds momentum.' +
      '</div>';
  }

  var fnBadge = s.fn
    ? '<span class="detail-fn fn-' + s.fn + '">' +
      (s.fn === "tonic" ? "tonic" : s.fn === "subdominant" ? "subdominant" : "dominant") +
      '</span>'
    : "";

  el.innerHTML =
    '<div class="detail-head">' +
      '<span class="detail-cname">' + esc(s.chordName) + '</span>' +
      (s.roman ? '<span class="detail-roman">' + esc(s.roman.label) + '</span>' : '') +
      fnBadge +
    '</div>' +
    buildSpellHtml(s) +
    (qDesc  ? '<div class="qdesc">' + esc(qDesc)  + '</div>' : '') +
    (fnDesc ? '<div class="fdesc">' + esc(fnDesc) + '</div>' : '') +
    (degDesc && degDesc !== qDesc ? '<div class="fdesc">' + esc(degDesc) + '</div>' : '') +
    specialHtml;
}

// ══════════════════════════════════════════════════════════════════════════════
// TEACH ME MODE: prose-based explanation using actual chord notes + key
// ══════════════════════════════════════════════════════════════════════════════

function renderTeachDetail(s) {
  var el = document.getElementById("detail");
  if (!s || !s.chordName) {
    el.innerHTML = '<div class="detail-empty">No chord detected here.</div>';
    return;
  }

  var html = "";

  // Header
  var fnBadge = s.fn
    ? '<span class="detail-fn fn-' + s.fn + '" style="margin-left:auto">' +
      (s.fn === "tonic" ? "tonic" : s.fn === "subdominant" ? "subdominant" : "dominant") +
      '</span>'
    : "";
  html += '<div class="detail-head">' +
    '<span class="detail-cname">' + esc(s.chordName) + '</span>' +
    (s.roman ? '<span class="detail-roman">' + esc(s.roman.label) + '</span>' : '') +
    fnBadge +
  '</div>';

  // Interval row (same in both modes: visual anchor)
  html += buildSpellHtml(s);

  // ── 1. Anatomy ────────────────────────────────────────────────────────────
  var anatomy = buildAnatomyText(s);
  if (anatomy) {
    html += '<div class="teach-section">' +
      '<div class="teach-tag">What makes it sound this way</div>' +
      '<div class="teach-p">' + anatomy + '</div>' +
    '</div>';
  }

  // ── 2. Role in key ────────────────────────────────────────────────────────
  if (s.roman) {
    var roleText = buildRoleText(s);
    if (roleText) {
      html += '<div class="teach-section">' +
        '<div class="teach-tag">Its role in ' + esc(DATA.key.label) + '</div>' +
        '<div class="teach-p">' + roleText + '</div>' +
      '</div>';
    }
  }

  // ── 3. Special context ────────────────────────────────────────────────────
  if (s.roman && (s.roman.borrowed || s.roman.secondary)) {
    var specialTitle = s.roman.borrowed ? 'Why it\'s "borrowed"' : "About this secondary dominant";
    var specialText  = buildSpecialTeachText(s);
    if (specialText) {
      var calloutClass = s.roman.borrowed ? "borrow" : "second";
      html += '<div class="teach-section">' +
        '<div class="teach-tag">' + specialTitle + '</div>' +
        '<div class="teach-callout ' + calloutClass + '">' + specialText + '</div>' +
      '</div>';
    }
  }

  el.innerHTML = html;
}

// ── Anatomy text (what makes each quality sound the way it does) ──────────
function buildAnatomyText(s) {
  var tones   = s.chordToneNames || [];
  var quality = s.quality || "";
  var root    = tones[0] ? "<strong>" + esc(tones[0]) + "</strong>" : "the root";
  var third   = tones[1] ? "<strong>" + esc(tones[1]) + "</strong>" : "the 3rd";
  var fifth   = tones[2] ? "<strong>" + esc(tones[2]) + "</strong>" : "the 5th";
  var seventh = tones[3] ? "<strong>" + esc(tones[3]) + "</strong>" : "the 7th";

  var A = {
    "major":
      "The defining feature here is the <strong>major 3rd</strong>: " + third +
      " sits 4 semitones above " + root + ". " +
      "That 4-semitone gap is what your brain reads as bright and uplifting. " +
      "Compress it by one semitone and you'd have a minor chord: same root, same fifth, " +
      "but the personality flips completely from uplifting to introspective. " +
      "One semitone is the entire distance between major and minor.",

    "minor":
      "The defining interval is the <strong>minor 3rd</strong>: " + third +
      " sits 3 semitones above " + root + ", one semitone closer than a major 3rd. " +
      "That single semitone compression is everything: your brain hears the deviation " +
      "from the natural harmonic series (which favors major 3rd relationships) " +
      "and interprets it as darker, more introspective. " +
      "Stretch it back out one semitone and you'd have a major chord.",

    "dominant7":
      "This is a <strong>dominant 7th</strong> chord: the most functionally powerful chord in tonal music. " +
      "The tension comes from a <strong>tritone</strong> hidden inside: the interval between " +
      third + " (major 3rd) and " + seventh + " (minor 7th) spans exactly 6 semitones: half an octave. " +
      "Tritones are maximally dissonant: their frequency ratio is approximately √2:1, which never resolves " +
      "to a simple integer relationship. Your ear doesn't just hear tension: it hears a demand to move, " +
      "usually down a perfect 5th. That demand is what drives tonal harmony forward.",

    "major7":
      "A <strong>major 7th</strong> chord adds " + seventh + ", one semitone below the octave, to a major triad. " +
      "That proximity to the root without being the root creates a floating quality: " +
      "close to home, but not quite there. It's tension without urgency, sophistication without instability. " +
      "Ubiquitous in jazz and bossa nova for exactly this reason.",

    "minor7":
      "This combines the minor chord's darkness with " + seventh + ", a minor 7th above the root. " +
      "The added 7th softens the minor chord slightly and opens it up harmonically. " +
      "Minor 7ths are the core color of jazz and soul harmony: emotionally rich, " +
      "stable enough to rest on, interesting enough to keep moving.",

    "diminished":
      "Every interval in a diminished chord is a minor 3rd, including the outermost interval " +
      "from " + root + " to " + fifth + ", a tritone instead of the usual perfect 5th. " +
      "The result is maximum instability from every angle. " +
      "There's no resting position, no stable relationship: only tension that needs to resolve, " +
      "almost always by moving up one semitone.",

    "augmented":
      "An augmented chord stretches the 5th up one semitone to " + fifth +
      ": an augmented 5th. " +
      "This creates two equal major 3rds stacked on each other, dividing the octave symmetrically. " +
      "The symmetry eliminates any sense of a clear root: every note sounds equally central. " +
      "The effect is ambiguous and dreamlike: untethered rather than tense.",

    "sus4":
      "A suspended 4th replaces the expected 3rd with " + third + ", a perfect 4th above the root. " +
      "The 4th 'leans' toward the major 3rd (just one semitone below it), " +
      "creating a characteristic suspended, expectant feeling. " +
      "The ear knows the 3rd is coming; it just hasn't arrived yet. " +
      "That suspended expectation is the entire personality of this chord.",

    "sus2":
      "A suspended 2nd replaces the 3rd with " + third + ", a major 2nd above the root. " +
      "Without a 3rd, the chord is neither major nor minor: open, spacious, and harmonically neutral. " +
      "Often used to create ambiguity between modes, or to give a progression room to breathe.",

    "half-dim7":
      "A half-diminished chord (also written ø7) has a diminished triad at its core " +
      "the tritone from " + root + " to " + fifth + ", but softened by " + seventh +
      " (a minor 7th rather than the diminished 7th of a full dim7). " +
      "Tense but less brittle, with a characteristically melancholic color. " +
      "Most often heard as the ii chord in minor keys (the iiø7).",

    "dim7":
      "A fully diminished 7th chord stacks four minor 3rds, creating cascading tritones. " +
      "Every interval is equal (3 semitones apart), making the chord completely symmetrical: " +
      "it has no preferred root, no stable relationship, and resolves ambiguously in any direction. " +
      "Maximum tension with maximum ambiguity.",

    "minor11":
      "A <strong>minor 11th</strong> stretches a minor 7th chord upward with the 9th and 11th. " +
      "Those upper notes make the chord feel less closed and more modal. " +
      "It is especially common when the harmony wants minor color without a hard resolution demand.",

    "dominant11":
      "A <strong>dominant 11th</strong> extends the dominant 7th sound with 9th and 11th color. " +
      "The 3rd and 7th still create dominant pull, while the 11th adds a suspended, wider sound above it.",

    "major13":
      "A <strong>major 13th</strong> extends a major 7th chord with upper color tones. " +
      "The 13th adds brightness and width without making the chord feel as urgent as a dominant chord.",

    "minor13":
      "A <strong>minor 13th</strong> keeps the minor 7th core but adds a bright 13th above it. " +
      "That mixture creates a modern minor sound: dark at the base, open at the top.",

    "dominant13":
      "A <strong>dominant 13th</strong> is an expanded dominant chord. " +
      "The 3rd and 7th create the pull, while the 13th adds a bright top color often heard in jazz, funk, soul, and gospel.",

    "dominant7sus4":
      "A <strong>7sus4</strong> chord keeps the dominant 7th but replaces the 3rd with the 4th. " +
      "That suspension delays whether the chord is major or minor, then often resolves by moving the 4th down to the 3rd.",
  };

  return A[quality] ||
    ("<strong>" + esc(s.chordName) + "</strong>: " +
     esc(QUALITY_DESC[quality] || "a chord with a distinctive harmonic character."));
}

// ── Role text (what the chord is doing in this specific key) ─────────────
function buildRoleText(s) {
  var roman    = s.roman;
  if (!roman) return "";
  var label    = roman.label;
  var baseDeg  = extractBaseDegree(label);
  var key      = DATA.key;
  var keyLabel = esc(key.label);
  var isMinor  = key.scaleName && key.scaleName.includes("minor");
  var rootName = esc(key.label.split(" ")[0]);
  var tonicChord = rootName + (isMinor ? "m" : "");
  var chordName  = esc(s.chordName);

  // Borrowed chords get their own modal interchange explanation below.
  if (roman.borrowed) return "";

  // Secondary dominants get their own explanation
  if (roman.secondary) {
    var target = extractSecondaryTarget(label);
    return "In " + keyLabel + ", this chord isn't playing a standard diatonic role: " +
      "it's acting as the <strong>dominant of " + esc(target || "another chord") + "</strong>. " +
      "It temporarily points to " + esc(target || "the next chord") + " as a local home, " +
      "then the progression moves on. " +
      "Secondary dominants work because V→I is the strongest harmonic motion available: " +
      "by applying it to any chord in the key, you create a brief local resolution there.";
  }

  var R = {
    "I":
      "In " + keyLabel + ", " + chordName + " is the <strong>tonic (I)</strong>: home base. " +
      "Every harmonic journey in this key begins and ends here. " +
      "This is the point of rest, resolution, arrival. " +
      "When the progression returns to this chord, the ear hears 'done': even temporarily.",

    "II":
      "In " + keyLabel + ", " + chordName + " is the <strong>II chord (supertonic)</strong>. " +
      "It has a subdominant quality: a gentle first step away from home, " +
      "without the full pull of the dominant. " +
      "The ii→V→I motion is one of the most fundamental sequences in all of harmony: " +
      "subdominant departs, dominant builds tension, tonic resolves it. " +
      "Learn that three-chord sequence and you'll hear it in everything from Bach to jazz.",

    "III":
      "In " + keyLabel + ", " + chordName + " is the <strong>III chord (mediant)</strong>. " +
      "It acts as a tonic substitute: sharing two notes with the I chord gives it a similar stability, " +
      "but with a different color. " +
      "Often used as a pivot chord, connecting I and IV with a smooth bass line movement.",

    "IV":
      "In " + keyLabel + ", " + chordName + " is the <strong>IV chord (subdominant)</strong>: " +
      "the first meaningful step away from home. " +
      "It creates a sense of departure: not tense enough to demand resolution like a dominant, " +
      "but clearly in motion. It can resolve directly back to I (the plagal 'Amen' cadence), " +
      "or continue to V to build more tension. " +
      "The subdominant is the counterweight to the dominant; together, they bracket the tonic.",

    "V":
      "In " + keyLabel + ", " + chordName + " is the <strong>V chord (dominant)</strong>: " +
      "music theory's tension chord. " +
      "Its root sits a perfect 5th above " + rootName + ", and that descending 5th motion back to the tonic " +
      "is one of the strongest harmonic pulls your ear recognizes. " +
      "Add a 7th and you get a built-in tritone, making the pull even more urgent. " +
      "This is the chord that makes the ear lean forward, expecting resolution.",

    "VI":
      "In " + keyLabel + ", " + chordName + " is the <strong>VI chord (submediant)</strong>: " +
      "the relative " + (isMinor ? "major" : "minor") + ". " +
      "It shares two notes with the I chord, making it a natural pivot: similar in feeling to home, " +
      "but with a " + (isMinor ? "brighter" : "darker") + " color. " +
      "Progressions often use the VI to vary the emotional arc; a familiar face wearing different clothes.",

    "VII":
      "In " + keyLabel + ", " + chordName + " is the <strong>VII chord (leading-tone chord)</strong>. " +
      "Built on the 7th scale degree: the note one semitone below the tonic: " +
      "it has an unusually strong directional pull upward to the I chord. " +
      "In major keys it's naturally diminished (very tense); in minor keys it's often major " +
      "(the raised 7th from harmonic minor). Either way, it almost always resolves to I.",
  };

  return R[baseDeg] ||
    "In " + keyLabel + ", " + chordName + " (" + esc(label) + ") " +
    "adds harmonic color that sits outside the strictly diatonic chords: " +
    "contributing variety and emotional depth to the progression.";
}

// ── Special context text (borrowed / secondary dominant) ─────────────────
function buildSpecialTeachText(s) {
  if (!s.roman) return "";
  var key      = DATA.key;
  var isMinor  = key.scaleName && key.scaleName.includes("minor");
  var parallel = esc(key.label.split(" ")[0] + " " + (isMinor ? "major" : "minor"));
  var chordName = esc(s.chordName);

  if (s.roman.borrowed) {
    return chordName + " doesn't appear in <strong>" + esc(key.label) + "</strong> naturally: " +
      "it comes from <strong>" + parallel + "</strong>, the same root but the opposite mode. " +
      "This technique is called <strong>modal interchange</strong> (or parallel mode borrowing): " +
      "you reach into the parallel key, borrow one of its chords, then return home. " +
      "The borrowed chord stands out because one or more of its notes are outside the home scale: " +
      "but because the root movement stays familiar, the ear accepts it. " +
      "It sounds 'different but right.' " +
      "Modal interchange is one of the most effective tools for adding unexpected color " +
      "without committing to a full key change. Scaler uses this constantly.";
  }

  if (s.roman.secondary) {
    var target = extractSecondaryTarget(s.roman.label) || "another chord";
    return "A <strong>secondary dominant</strong> is a V chord that resolves somewhere other than the tonic. " +
      "Here, " + chordName + " is acting as V of <strong>" + esc(target) + "</strong>. " +
      "For one moment, it makes " + esc(target) + " sound like home: " +
      "a mini V→I cadence embedded inside the larger progression. " +
      "Secondary dominants work because the V→I relationship is acoustically strong: " +
      "the tritone resolves inward, the bass drops a 5th, and the ear hears arrival. " +
      "By applying that mechanism to any chord in the key, you create forward momentum " +
      "and a feeling of harmonic sophistication: like the progression has its own internal logic.";
  }

  return "";
}

// ── Progression narrative ──────────────────────────────────────────────────
function buildNarrative(segments) {
  if (!segments.length) return "";

  var degrees = segments.map(function(s) {
    return s.roman ? extractBaseDegree(s.roman.label) : null;
  });

  var hasBorrowed  = segments.some(function(s) { return s.roman && s.roman.borrowed; });
  var hasSecondary = segments.some(function(s) { return s.roman && s.roman.secondary; });
  var lastFn = segments[segments.length - 1].fn;

  function hasSeq(pattern) {
    var d = degrees.filter(function(x) { return x; });
    for (var i = 0; i <= d.length - pattern.length; i++) {
      if (pattern.every(function(p, j) { return d[i+j] === p; })) return true;
    }
    return false;
  }

  var parts = [];

  if (DATA.resolutionSuggestions && DATA.resolutionSuggestions.length) {
    DATA.resolutionSuggestions.forEach(function(s) {
      parts.push("<b>Try next: " + esc(s.label) + "</b>: " + esc(s.reason));
    });
  }

  if (DATA.progressions && DATA.progressions.length) {
    DATA.progressions.forEach(function(p) {
      parts.push("<b>" + esc(p.pattern) + "</b>: " + esc(p.description));
    });
  } else if (hasSeq(["II","V","I"])) {
    parts.push("<b>ii to V to I cadence</b>: the cornerstone of jazz and tonal harmony. The ii chord (subdominant) sets up expectation; V7 builds tension through its tritone; I resolves home. Learn this one: it's everywhere.");
  } else if (hasSeq(["I","V","VI","IV"])) {
    parts.push("<b>I to V to vi to IV</b>: one of the most-used progressions in modern music. Stable tonic → dominant energy → darker relative minor → subdominant color → repeat.");
  } else if (hasSeq(["I","VI","IV","V"])) {
    parts.push("<b>I to vi to IV to V</b>: the 50s/doo-wop progression. Tonic stability, a pivot to the relative minor, subdominant departure, then the dominant drives home.");
  } else if (hasSeq(["VI","IV","I","V"])) {
    parts.push("<b>vi to IV to I to V</b>: a rotation of the four-chord pop progression, starting on the relative minor. Opens with melancholy that brightens when I arrives.");
  } else if (hasSeq(["I","IV","V"])) {
    parts.push("<b>I to IV to V</b>: the three primary harmonic functions in a single motion. The backbone of blues, rock, folk, and country.");
  } else if (hasSeq(["IV","I"])) {
    parts.push("Ends with a <b>IV→I plagal cadence</b>: the \"Amen\" cadence. Softer and more archaic-feeling than V→I; the subdominant resolves without the sharp pull of a dominant.");
  } else if (hasSeq(["V","I"])) {
    parts.push("Ends with an <b>authentic cadence (V→I)</b>: the most definitive harmonic arrival in western music. The dominant's tritone resolves, and the descending 5th root motion confirms the tonic.");
  }

  if (hasBorrowed) {
    parts.push("The <b>borrowed chord(s)</b> are modal interchange: chords lifted from the parallel " + (DATA.key.scaleName === "major" ? "minor" : "major") + " key. This technique lets you pull in unexpected harmonic color while staying rooted in the key. Scaler often suggests these as 'outside' options.");
  }
  if (hasSecondary) {
    parts.push("<b>Secondary dominants</b> create brief local resolutions by treating a non-tonic chord as a temporary home and approaching it with its own V7. Each one is a micro-cadence that adds momentum and a feeling of harmonic sophistication.");
  }

  if (!parts.length) {
    if (lastFn === "tonic") {
      parts.push("The progression resolves to a <b>tonic chord</b>: a sense of arrival and completion. Even without a named template, the ear recognizes the return to stability.");
    } else if (lastFn === "dominant") {
      parts.push("The progression ends on a <b>dominant chord</b>: an open, unresolved feeling. This is a half cadence: it leaves the listener in suspense, expecting continuation.");
    } else {
      parts.push("A less common harmonic path. Tonic means rest, subdominant means departure, and dominant means tension. Those functions shape the emotional arc. The colored bar on each card shows each chord's role.");
    }
  }

  return parts.join(" ");
}

function renderNarrative() {
  var el   = document.getElementById("narrative");
  var text = buildNarrative(DATA.segments);
  el.innerHTML =
    '<div class="narrative-title">Progression context</div>' +
    '<div class="narrative-text">' + text + '</div>';
}

// ── Init ───────────────────────────────────────────────────────────────────
renderNarrative();
renderCards();

if (DATA.segments.length > 0) {
  selectedIdx = 0;
  renderCards();
  renderCurrentDetail(DATA.segments[0]);
}
</script>
