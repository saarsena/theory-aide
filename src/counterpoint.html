<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counterpoint Checker</title>
<script>
// Blocking: set the saved theme before any CSS paints (prevents a dark flash).
(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ta-theme")||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<style>
:root {
  --bg:#181818; --panel:#212121; --panel2:#272727; --line:#2e2e2e; --line2:#3a3a3a;
  --text:#d8d8d8; --dim:#888; --dim2:#555; --accent:#ffaa2b; --warn:#e0564f;
  --ok:#6fbf73; --caution:#e08f4f; --info:#5b9bd5; --purple:#c9a7ff;
}
html[data-theme="light"] {
  --bg:#f2f0ec; --panel:#e8e6e2; --panel2:#dedbd7; --line:#cac7c2; --line2:#b0ada8;
  --text:#1c1c1c; --dim:#666; --dim2:#888; --accent:#a06800; --warn:#c02020;
  --ok:#2a7a30; --caution:#a05010; --info:#1855a0; --purple:#6030b0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
       font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.hdr { padding: 10px 14px 0; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.hdr-title { font-size: 15px; font-weight: 600; }
.hdr-sub { color: var(--dim); font-size: 11px; flex: 1; }
.hdr-btn { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2);
           border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
.hdr-btn:hover { color: var(--text); }
.detail-btn { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2);
              border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
.detail-btn:hover { color: var(--text); }
.headline { font-size: 14px; line-height: 1.5; padding: 8px 14px 0; flex-shrink: 0; }
body:not(.mode-detailed) .detail-only { display: none; }
.term { border-bottom: 1px dotted currentColor; cursor: help; }
.next-link { background: var(--accent); color: #1a1a1a; border: 1px solid var(--accent);
             border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 11px; font-weight: 600; }

.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 14px;
        margin-top: 8px; gap: 0; flex-shrink: 0; }
.tab { padding: 6px 14px; cursor: pointer; font-size: 12px; color: var(--dim);
       border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }

.pane { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; }
.pane.active { display: block; }

/* Stat cards */
.stat-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: 8px 12px; min-width: 110px; flex: 1; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--dim); margin-top: 2px; }
.stat.bad  .stat-val { color: var(--warn); }
.stat.caution .stat-val { color: var(--caution); }
.stat.ok   .stat-val { color: var(--ok); }
.stat.info .stat-val { color: var(--info); }

/* Motion bar */
.section { margin-bottom: 14px; }
.section-title { font-size: 11px; font-weight: 600; color: var(--dim);
                 text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.motion-bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden;
              border: 1px solid var(--line); }
.motion-seg { display: flex; align-items: center; justify-content: center;
              font-size: 10px; font-weight: 600; color: #fff; min-width: 0;
              overflow: hidden; white-space: nowrap; transition: width .3s; }
.motion-seg.contrary { background: var(--ok); }
.motion-seg.oblique  { background: var(--info); }
.motion-seg.similar  { background: var(--caution); }
.motion-seg.parallel { background: var(--warn); }
.motion-legend { display: flex; gap: 12px; margin-top: 5px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--dim); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* Interval grid */
.iv-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.iv-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
           padding: 5px 6px; text-align: center; }
.iv-name { font-size: 10px; color: var(--dim); }
.iv-bar-wrap { height: 32px; display: flex; align-items: flex-end; margin: 3px 0; }
.iv-bar { background: var(--accent); border-radius: 2px 2px 0 0; width: 100%; min-height: 2px; }
.iv-beats { font-size: 9px; color: var(--dim2); }

/* Flagged table */
.flag-section { margin-bottom: 16px; }
.flag-hdr { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.flag-badge { padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-red    { background: rgba(224,86,79,.18); color: var(--warn); border: 1px solid rgba(224,86,79,.3); }
.badge-orange { background: rgba(224,143,79,.15); color: var(--caution); border: 1px solid rgba(224,143,79,.3); }
.badge-blue   { background: rgba(91,155,213,.13); color: var(--info); border: 1px solid rgba(91,155,213,.3); }
.flag-label { font-size: 12px; font-weight: 600; }
.flag-none { font-size: 11px; color: var(--ok); padding: 4px 0; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 10px; color: var(--dim); font-weight: 500; background: var(--panel2);
     position: sticky; top: 0; }
td { font-size: 11px; }
td.mono { font-family: monospace; }
tr:hover td { background: var(--panel); }
.note-name { font-size: 10px; color: var(--dim); }

/* By-pair tab */
.pair-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.pair-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 11px; color: var(--dim); }
.pair-btn.active, .pair-btn:hover { color: var(--text); border-color: var(--accent); }
.pair-btn.active { color: var(--accent); }
.pair-detail { display: none; }
.pair-detail.active { display: block; }

.mini-stat-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.mini-stat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
             padding: 4px 8px; font-size: 11px; }
.mini-stat span { font-weight: 600; }

.clean-msg { color: var(--ok); font-size: 12px; padding: 16px 0; }

.more-note { font-size: 10px; color: var(--dim2); margin-top: 4px; }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">Counterpoint Checker</div>
  <div class="hdr-sub" id="sub-line"></div>
  <button class="next-link" id="next-link">→ What should I do next?</button>
  <button class="detail-btn" id="detail-btn">Show details</button>
  <button class="hdr-btn" id="theme-btn">Light</button>
</div>
<div class="headline" id="headline"></div>
<div class="tabs">
  <div class="tab active" data-tab="overview">Overview</div>
  <div class="tab" data-tab="flagged">Flagged</div>
  <div class="tab detail-only" data-tab="pairs">By Pair</div>
</div>
<div class="pane active" id="pane-overview"></div>
<div class="pane" id="pane-flagged"></div>
<div class="pane" id="pane-pairs"></div>

<script>
(function() {
  var KEY = "ta-theme", saved = "light";
  try { saved = localStorage.getItem(KEY) || "light"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

var NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function midiNote(p) { return NOTES[p % 12] + (Math.floor(p / 12) - 2); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var DATA = __COUNTERPOINT_JSON__;

// Subheader
document.getElementById("sub-line").textContent =
  DATA.trackNames.length + " tracks · " + DATA.pairs.length + " pairs" +
  (DATA.truncated ? " (truncated — deselect more tracks)" : "") +
  " · b" + DATA.rangeStart.toFixed(2) + "–b" + DATA.rangeEnd.toFixed(2);

// ── Shared pilot helpers: glossary, Simple/Detailed toggle, action handoff ──
var GLOSSARY={"tonic":"The home chord or note — where the music feels at rest.","subdominant":"Harmony that pulls away from home and sets up tension (the IV side).","dominant":"The tension chord that wants to fall back to the tonic (the V).","borrowed":"A chord taken from the parallel major/minor for extra color.","secondary dominant":"A V chord aimed at a chord other than the tonic, briefly making it feel like home.","syncopation":"Accents landing off the strongest beats, giving a pushed, lively feel.","voice leading":"How each line moves note-to-note from one chord to the next.","parallel fifths":"Two voices a 5th apart moving the same direction — the classic counterpoint no-no.","parallel octaves":"Two voices an octave apart moving together, collapsing two lines into one.","hidden fifth":"Both voices leap the same direction into a 5th — a softer parallel-5th.","hidden octave":"Both voices leap the same direction into an octave.","contrary motion":"Two voices moving in opposite directions — the most independent, strongest motion.","oblique motion":"One voice holds while the other moves.","similar motion":"Two voices moving the same direction by different amounts.","parallel motion":"Two voices moving the same direction by the same interval.","density":"How many notes sound at once or in quick succession — how full it feels.","register":"How high or low the notes sit overall."};
var GLOSS_RE=new RegExp("\\b("+Object.keys(GLOSSARY).sort(function(a,b){return b.length-a.length;}).map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")\\b","gi");
function glossify(escaped){return String(escaped).replace(GLOSS_RE,function(m){var def=GLOSSARY[m.toLowerCase()];return def?'<span class="term" title="'+def.replace(/"/g,"&quot;")+'">'+m+'</span>':m;});}
(function(){var KEY="ta-detail";var saved="simple";try{saved=localStorage.getItem(KEY)||"simple";}catch(e){}if(saved==="detailed")document.body.classList.add("mode-detailed");var b=document.getElementById("detail-btn");if(b){b.textContent=saved==="detailed"?"Hide details":"Show details";b.addEventListener("click",function(){var on=!document.body.classList.contains("mode-detailed");document.body.classList.toggle("mode-detailed",on);try{localStorage.setItem(KEY,on?"detailed":"simple");}catch(e){}b.textContent=on?"Hide details":"Show details";});}})();
function sendNext(){var msg={method:"close_and_send",params:["__OPEN_WHATNEXT__"]};if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.live)window.webkit.messageHandlers.live.postMessage(msg);else if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(msg);}
document.getElementById("next-link").addEventListener("click",sendNext);
document.getElementById("headline").innerHTML = glossify(esc(DATA.headline || ""));

// Tab switching
document.querySelectorAll(".tab").forEach(function(t) {
  t.addEventListener("click", function() {
    document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
    document.querySelectorAll(".pane").forEach(function(x) { x.classList.remove("active"); });
    t.classList.add("active");
    document.getElementById("pane-" + t.dataset.tab).classList.add("active");
  });
});

// ── Helpers ───────────────────────────────────────────────────────────

function motionBar(mc) {
  var total = mc.total || 1;
  var segs = [
    { k: "contrary", label: "Contrary" },
    { k: "oblique",  label: "Oblique" },
    { k: "similar",  label: "Similar" },
    { k: "parallel", label: "Parallel" },
  ];
  var html = '<div class="motion-bar">';
  segs.forEach(function(s) {
    var pct = Math.round(mc[s.k] / total * 100);
    if (pct === 0) return;
    html += '<div class="motion-seg ' + s.k + '" style="width:' + pct + '%">' +
            (pct >= 12 ? pct + "%" : "") + '</div>';
  });
  html += '</div><div class="motion-legend">';
  segs.forEach(function(s) {
    html += '<span class="legend-item"><span class="legend-dot" style="background:var(--' +
            (s.k==="contrary"?"ok":s.k==="oblique"?"info":s.k==="similar"?"caution":"warn") + ')"></span>' +
            esc(s.label) + ' (' + mc[s.k] + ')</span>';
  });
  html += '</div>';
  return html;
}

function ivGridHtml(dist) {
  if (!dist.length) return '<span style="color:var(--dim);font-size:11px">No simultaneous notes found.</span>';
  var maxBeats = Math.max.apply(null, dist.map(function(d) { return d.beats; })) || 1;
  var html = '<div class="iv-grid">';
  dist.forEach(function(d) {
    var h = Math.round(d.beats / maxBeats * 28);
    html += '<div class="iv-cell">' +
            '<div class="iv-name">' + esc(d.name) + '</div>' +
            '<div class="iv-bar-wrap"><div class="iv-bar" style="height:' + Math.max(2, h) + 'px"></div></div>' +
            '<div class="iv-beats">' + d.beats.toFixed(1) + 'b</div>' +
            '</div>';
  });
  html += '</div>';
  return html;
}

function flagTableHtml(events, truncated) {
  if (!events.length) return '<div class="flag-none">None found.</div>';
  var html = '<table><thead><tr><th>Beat</th><th>From</th><th>→ To</th><th>Motion</th></tr></thead><tbody>';
  events.forEach(function(e) {
    var pA = esc(midiNote(e.pitchA1)) + "→" + esc(midiNote(e.pitchA2));
    var pB = esc(midiNote(e.pitchB1)) + "→" + esc(midiNote(e.pitchB2));
    html += '<tr>' +
      '<td class="mono">b' + e.time.toFixed(2) + '</td>' +
      '<td>' + esc(e.intervalBeforeName) + '</td>' +
      '<td>' + esc(e.intervalAfterName) + '</td>' +
      '<td>' + esc(e.motionType) +
        ' <span class="note-name">(' + pA + ' / ' + pB + ')</span></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  if (truncated) html += '<div class="more-note">Showing first 40 occurrences.</div>';
  return html;
}

// ── Overview pane ─────────────────────────────────────────────────────

(function buildOverview() {
  var t = DATA.totals;
  var mc = t.motionCounts;
  var total = mc.total || 1;
  var contraryPct = Math.round(mc.contrary / total * 100);

  var statClass = function(n, isWarning) {
    if (n === 0) return isWarning ? "ok" : "info";
    return isWarning ? "bad" : "info";
  };

  var html = '<div class="stat-row">' +
    '<div class="stat ' + statClass(t.parallelFifths, true) + '">' +
      '<div class="stat-val">' + t.parallelFifths + '</div>' +
      '<div class="stat-lbl">Parallel 5ths</div></div>' +
    '<div class="stat ' + statClass(t.parallelOctaves, true) + '">' +
      '<div class="stat-val">' + t.parallelOctaves + '</div>' +
      '<div class="stat-lbl">Parallel 8ths</div></div>' +
    '<div class="stat ' + statClass(t.parallelUnisons, false) + '">' +
      '<div class="stat-val">' + t.parallelUnisons + '</div>' +
      '<div class="stat-lbl">Parallel Unisons</div></div>' +
    '<div class="stat caution">' +
      '<div class="stat-val">' + t.hiddenFifths + '</div>' +
      '<div class="stat-lbl">Hidden 5ths</div></div>' +
    '<div class="stat caution">' +
      '<div class="stat-val">' + t.hiddenOctaves + '</div>' +
      '<div class="stat-lbl">Hidden 8ths</div></div>' +
    '</div>';

  // Motion summary
  html += '<div class="section">' +
    '<div class="section-title">Motion Texture · ' + mc.total + ' voice transitions</div>' +
    motionBar(mc) + '</div>';

  // Interpretation
  var interp = "";
  if (contraryPct >= 40) interp = "Strong contrary motion — voices are moving independently.";
  else if (contraryPct >= 20) interp = "Mix of contrary and parallel motion — moderate voice independence.";
  else interp = "Mostly parallel or similar motion — voices move together more than independently.";
  html += '<div style="font-size:11px;color:var(--dim);margin-bottom:12px">' + glossify(esc(interp)) + '</div>';

  // Aggregate interval distribution across all pairs
  var aggDist = new Map();
  DATA.pairs.forEach(function(p) {
    p.intervalDistribution.forEach(function(d) {
      var e = aggDist.get(d.simple) || { simple: d.simple, name: d.name, count: 0, beats: 0 };
      e.count += d.count; e.beats += d.beats;
      aggDist.set(d.simple, e);
    });
  });
  var distArr = Array.from(aggDist.values()).sort(function(a, b) { return a.simple - b.simple; });

  html += '<div class="section detail-only">' +
    '<div class="section-title">Harmonic Interval Distribution (combined)</div>' +
    ivGridHtml(distArr) + '</div>';

  html += '<div class="detail-only" style="font-size:10px;color:var(--dim2);margin-top:8px">' +
    'Parallel 5ths/octaves are prohibited in classical counterpoint. In jazz and pop they are ' +
    'often intentional. Hidden 5ths/octaves = similar motion into a perfect interval where the ' +
    'upper voice leaps (contextually problematic). Unisons = voices merging.' +
    '</div>';

  document.getElementById("pane-overview").innerHTML = html;
})();

// ── Flagged pane ──────────────────────────────────────────────────────

(function buildFlagged() {
  // Collect all flagged events across all pairs, tag with track pair name, sort by time
  function collect(field, label, badgeClass) {
    var all = [];
    DATA.pairs.forEach(function(p) {
      p[field].forEach(function(e) {
        all.push({ e: e, pair: p.trackA + " / " + p.trackB });
      });
    });
    all.sort(function(a, b) { return a.e.time - b.e.time; });
    if (!all.length) return '<div class="flag-section"><div class="flag-hdr">' +
      '<span class="flag-badge ' + badgeClass + '">' + label + '</span>' +
      '<span class="flag-label">0 found</span></div>' +
      '<div class="flag-none">None found.</div></div>';
    var truncated = all.length > 40;
    var shown = all.slice(0, 40);
    var html = '<div class="flag-section"><div class="flag-hdr">' +
      '<span class="flag-badge ' + badgeClass + '">' + label + '</span>' +
      '<span class="flag-label">' + all.length + ' occurrence' + (all.length !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<table><thead><tr><th>Beat</th><th>Pair</th><th>From</th><th>→ To</th><th>Motion</th></tr></thead><tbody>';
    shown.forEach(function(item) {
      var e = item.e;
      var pA = esc(midiNote(e.pitchA1)) + "→" + esc(midiNote(e.pitchA2));
      var pB = esc(midiNote(e.pitchB1)) + "→" + esc(midiNote(e.pitchB2));
      html += '<tr>' +
        '<td class="mono">b' + e.time.toFixed(2) + '</td>' +
        '<td style="color:var(--dim);font-size:10px">' + esc(item.pair) + '</td>' +
        '<td>' + esc(e.intervalBeforeName) + '</td>' +
        '<td>' + esc(e.intervalAfterName) + '</td>' +
        '<td>' + esc(e.motionType) +
          ' <span class="note-name">(' + pA + ' / ' + pB + ')</span></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    if (truncated) html += '<div class="more-note">Showing first 40 of ' + all.length + '.</div>';
    html += '</div>';
    return html;
  }

  var total = DATA.totals.parallelFifths + DATA.totals.parallelOctaves +
              DATA.totals.hiddenFifths + DATA.totals.hiddenOctaves +
              DATA.totals.parallelUnisons;

  var html = "";
  if (total === 0) {
    html = '<div class="clean-msg">No parallel 5ths, parallel octaves, hidden 5ths, hidden octaves, or parallel unisons found.</div>';
  } else {
    html += collect("parallelFifths",  "PROHIBITED", "badge-red");
    html += collect("parallelOctaves", "PROHIBITED", "badge-red");
    html += collect("hiddenFifths",    "HIDDEN 5th", "badge-orange");
    html += collect("hiddenOctaves",   "HIDDEN 8th", "badge-orange");
    html += collect("parallelUnisons", "UNISON",     "badge-blue");
  }

  document.getElementById("pane-flagged").innerHTML = html;
})();

// ── By-Pair pane ──────────────────────────────────────────────────────

(function buildPairs() {
  if (!DATA.pairs.length) {
    document.getElementById("pane-pairs").innerHTML =
      '<div style="color:var(--dim);padding:16px">Need at least 2 MIDI tracks to compare pairs.</div>';
    return;
  }

  var html = '<div class="pair-selector">';
  DATA.pairs.forEach(function(p, i) {
    html += '<div class="pair-btn' + (i === 0 ? ' active' : '') + '" data-pair="' + i + '">' +
            esc(p.trackA) + ' / ' + esc(p.trackB) + '</div>';
  });
  html += '</div>';

  DATA.pairs.forEach(function(p, i) {
    var mc = p.motionCounts;
    html += '<div class="pair-detail' + (i === 0 ? ' active' : '') + '" id="pair-detail-' + i + '">';

    html += '<div class="mini-stat-row">' +
      '<div class="mini-stat">5ths: <span style="color:' + (p.parallelFifths.length ? 'var(--warn)' : 'var(--ok)') + '">' + p.parallelFifths.length + '</span></div>' +
      '<div class="mini-stat">8ths: <span style="color:' + (p.parallelOctaves.length ? 'var(--warn)' : 'var(--ok)') + '">' + p.parallelOctaves.length + '</span></div>' +
      '<div class="mini-stat">Hid 5th: <span style="color:' + (p.hiddenFifths.length ? 'var(--caution)' : 'var(--ok)') + '">' + p.hiddenFifths.length + '</span></div>' +
      '<div class="mini-stat">Hid 8th: <span style="color:' + (p.hiddenOctaves.length ? 'var(--caution)' : 'var(--ok)') + '">' + p.hiddenOctaves.length + '</span></div>' +
      '<div class="mini-stat">Unisons: <span>' + p.parallelUnisons.length + '</span></div>' +
      '<div class="mini-stat">Events: <span>' + p.totalEvents + '</span></div>' +
      '</div>';

    html += '<div class="section"><div class="section-title">Motion (' + mc.total + ' transitions)</div>' +
            motionBar(mc) + '</div>';

    html += '<div class="section"><div class="section-title">Interval Distribution</div>' +
            ivGridHtml(p.intervalDistribution) + '</div>';

    html += '</div>'; // pair-detail
  });

  document.getElementById("pane-pairs").innerHTML = html;

  document.querySelectorAll(".pair-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var idx = btn.dataset.pair;
      document.querySelectorAll(".pair-btn").forEach(function(b) { b.classList.remove("active"); });
      document.querySelectorAll(".pair-detail").forEach(function(d) { d.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("pair-detail-" + idx).classList.add("active");
    });
  });
})();
</script>
</body>
