<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #181818; --panel: #222; --line: #333; --text: #d8d8d8;
    --dim: #8f8f8f; --accent: #ffaa2b; --warn: #e0564f;
    --tonic: #5b9bd5; --subdom: #6fbf73; --dom: #e08f4f;
  }
  html[data-theme="light"] {
    --bg:    #f2f0ec;
    --panel: #e8e6e2;
    --line:  #cac7c2;
    --text:  #1c1c1c;
    --dim:   #666;
    --accent: #a06800;
    --warn:   #c02020;
    --tonic:  #1855a0;
    --subdom: #2a7a30;
    --dom:    #a05010;
  }
  html[data-theme="light"] .seg.onpage        { background: #dedad4; border-color: #b0ada8; }
  html[data-theme="light"] .seg.clash         { border-color: #b04040; }
  html[data-theme="light"] .seg:hover         { border-color: #888; }
  html[data-theme="light"] .pill.borrowed     { background: #ede8ff; color: #6030b0; }
  html[data-theme="light"] .pill.secondary    { background: #e8f0ff; color: #1848a8; }
  html[data-theme="light"] .pager-btn         { background: #dedad4; border-color: #b0ada8; color: var(--dim); }
  html[data-theme="light"] .pager-btn:not([disabled]):hover { background: #d0ccc6; color: var(--text); }
  html[data-theme="light"] td                 { border-bottom-color: #d8d5d0; }
  html[data-theme="light"] button.close-btn   { background: #dedad4; border-color: #b0ada8; color: var(--text); }
  html[data-theme="light"] button.close-btn:hover { background: #d0ccc6; }
  html[data-theme="light"] .strip-wrap::-webkit-scrollbar-thumb { background: #b8b4ae; }
  html[data-theme="light"] .table-wrap::-webkit-scrollbar-thumb { background: #b8b4ae; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, sans-serif;
    padding: 14px 18px 10px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ── Header ── */
  .hd { flex-shrink: 0; }
  .hd-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  h1 { font-size: 15px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .keybadge { display: inline-block; background: var(--panel); border: 1px solid var(--line);
              border-radius: 4px; padding: 2px 9px; margin-right: 6px; font-size: 12px; }
  .keybadge b { color: var(--accent); font-weight: 600; }
  .mismatch { color: var(--warn); }
  .theme-btn {
    background: transparent; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 10px; font-size: 11px;
    cursor: pointer; color: var(--dim);
  }
  .theme-btn:hover { color: var(--text); border-color: var(--dim); }

  /* ── Shared Theory Aide pilot pattern ── */
  .detail-btn { background: transparent; border: 1px solid var(--line); border-radius: 4px;
                padding: 3px 10px; font-size: 11px; cursor: pointer; color: var(--dim); }
  .detail-btn:hover { color: var(--text); border-color: var(--dim); }
  .headline { font-size: 14px; line-height: 1.5; margin-top: 6px; }
  .detail-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  body:not(.mode-detailed) .detail-only { display: none; }
  .term { border-bottom: 1px dotted currentColor; cursor: help; }
  .next-link { background: var(--accent); color: #1a1a1a; border: 1px solid var(--accent);
               border-radius: 4px; padding: 5px 14px; cursor: pointer; font-size: 12px; font-weight: 600; }

  /* ── Range comparison ── */
  .compare {
    flex-shrink: 0;
    display: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--panel);
    padding: 8px 10px;
    gap: 10px;
  }
  .compare.show { display: grid; grid-template-columns: 1fr 1fr 1.2fr; }
  .compare-title {
    color: var(--dim); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
  }
  .compare-main { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .compare-meta { color: var(--dim); font-size: 11px; }
  .compare-list { margin: 0; padding-left: 16px; color: var(--text); font-size: 11.5px; }
  .compare-list li { margin-bottom: 2px; }

  /* ── Chord strip ── */
  .strip-wrap { flex-shrink: 0; height: 68px; overflow-x: auto; overflow-y: hidden; }
  .strip-wrap::-webkit-scrollbar { height: 4px; }
  .strip-wrap::-webkit-scrollbar-track { background: transparent; }
  .strip-wrap::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }
  .strip { display: flex; gap: 2px; height: 64px; }
  .seg {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 5px 5px;
    flex-shrink: 0; position: relative; overflow: hidden;
    cursor: pointer; user-select: none;
  }
  .seg:hover { border-color: #555; }
  .seg.onpage { border-color: #444; background: #252525; }
  .seg.onpage.clash { border-color: var(--warn); }
  .seg.clash { border-color: #6b3333; }
  .seg .chord { font-weight: 600; font-size: 11px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  .seg .roman { color: var(--accent); font-size: 10px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  .seg .beats { color: var(--dim); font-size: 9px; margin-top: 2px; white-space: nowrap; }
  .seg .fnbar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .fn-tonic       { background: var(--tonic); }
  .fn-subdominant { background: var(--subdom); }
  .fn-dominant    { background: var(--dom); }
  .tension-wrap { flex-shrink: 0; height: 18px; overflow-x: auto; overflow-y: hidden; }
  .tension-wrap::-webkit-scrollbar { height: 4px; }
  .tension-wrap::-webkit-scrollbar-track { background: transparent; }
  .tension-wrap::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }
  .tension { display: flex; gap: 2px; height: 12px; align-items: stretch; }
  .tension-cell { border-radius: 2px; flex-shrink: 0; min-width: 48px; }

  /* ── Table ── */
  .table-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    scrollbar-color: var(--line) transparent;
  }
  .table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px;
       border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0;
       position: sticky; top: 0; background: var(--bg); z-index: 1; }
  td { padding: 5px 8px 5px 0; border-bottom: 1px solid #262626; vertical-align: top; font-size: 12.5px; }
  td.roman { color: var(--accent); }
  .pill { display: inline-block; border-radius: 3px; padding: 0 6px; font-size: 11px; margin-right: 3px; }
  .pill.borrowed  { background: #3a2d4d; color: #c9a7ff; }
  .pill.secondary { background: #2d3a4d; color: #8fc1ff; }
  .pill.fn { background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
  .warnline { color: var(--warn); font-size: 11.5px; }
  .infoline { color: var(--dim); font-size: 11.5px; }
  .dimtext { color: var(--dim); }

  /* ── Pager ── */
  .pager { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .pager-btn {
    background: #252525; color: var(--dim); border: 1px solid #383838;
    border-radius: 3px; padding: 3px 14px; cursor: pointer; font-size: 12px;
  }
  .pager-btn:not([disabled]):hover { background: #2f2f2f; color: var(--text); }
  .pager-btn[disabled] { opacity: 0.35; cursor: default; }
  .pager-info { flex: 1; font-size: 11px; color: var(--dim); text-align: center; }
  .pager-hint { font-size: 10px; color: var(--dim2); }

  /* ── Footer ── */
  .footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
  .cands { color: var(--dim); font-size: 11px; }
  button.close-btn {
    background: #2f2f2f; color: #ddd; border: 1px solid #444;
    border-radius: 4px; padding: 5px 22px; cursor: pointer; font-size: 13px;
  }
  button.close-btn:hover { background: #3a3a3a; }
</style>
</head>
<body>

  <div class="hd">
    <div class="hd-top">
      <h1>Harmonic Timeline</h1>
      <div style="display:flex;gap:6px">
        <button class="detail-btn" id="detail-btn">Show details</button>
        <button class="theme-btn" id="theme-btn">Light</button>
      </div>
    </div>
    <div class="sub" id="sub"></div>
    <div id="keys"></div>
    <div class="headline" id="headline"></div>
  </div>

  <div class="compare" id="compare"></div>

  <div class="strip-wrap"><div class="strip" id="strip"></div></div>
  <div class="tension-wrap" title="Tension score"><div class="tension" id="tension"></div></div>

  <div class="detail-wrap detail-only">
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:68px">Bars</th>
        <th style="width:90px">Chord</th>
        <th style="width:108px">Roman</th>
        <th style="width:140px">Function</th>
        <th>Notes sounding</th>
        <th>Warnings</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="pager" id="pager">
    <button class="pager-btn" id="view-toggle">Single view</button>
    <button class="pager-btn" id="prev">← Prev</button>
    <span class="pager-info" id="page-info"></span>
    <button class="pager-btn" id="next">Next →</button>
    <span class="pager-hint" id="pager-hint">← → keys</span>
  </div>
  </div>

  <div class="footer">
    <div class="cands" id="cands"></div>
    <div style="display:flex;gap:8px">
      <button class="next-link" id="next-link">→ What should I do next?</button>
      <button class="close-btn" id="copy-summary" style="background:transparent;border-color:var(--line);color:var(--dim)">Copy Summary</button>
      <button class="close-btn" id="close">Close</button>
    </div>
  </div>

<script>
var DATA = __TIMELINE_JSON__;
var PAGE_SIZE = 10;
var currentPage = 0;
var viewMode = "paged";  // "paged" | "single"
try { viewMode = localStorage.getItem("ta-timeline-view") || "paged"; } catch(e) {}

// ── Theme toggle ──────────────────────────────────────────────────────────
(function() {
  var KEY = "ta-theme";
  var saved = "light";
  try { saved = localStorage.getItem(KEY) || "light"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

function closeDialog() {
  var msg = { method: "close_and_send", params: ["null"] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live)
    window.webkit.messageHandlers.live.postMessage(msg);
  else if (window.chrome && window.chrome.webview)
    window.chrome.webview.postMessage(msg);
}

document.getElementById("close").addEventListener("click", closeDialog);
document.getElementById("copy-summary").addEventListener("click", function() {
  var btn = this;
  navigator.clipboard.writeText(DATA.textSummary || "").then(function() {
    var old = btn.textContent;
    btn.textContent = "Copied!";
    btn.style.borderColor = "var(--tonic)";
    btn.style.color = "var(--tonic)";
    setTimeout(function() {
      btn.textContent = old;
      btn.style.borderColor = "var(--line)";
      btn.style.color = "var(--dim)";
    }, 2000);
  });
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") { closeDialog(); return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") changePage(1);
  if (e.key === "ArrowLeft"  || e.key === "PageUp")   changePage(-1);
});

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function bars(beat) {
  return (Math.floor(beat / 4) + 1) + "." + (Math.floor(beat % 4) + 1);
}
function fnLabel(fn) {
  return fn === "tonic" ? "T · tonic"
       : fn === "subdominant" ? "S · subdominant"
       : fn === "dominant" ? "D · dominant" : "";
}
function hasHardWarning(s) {
  return !!(s.outliers && s.outliers.some(function(o) { return o.severity === "warn"; }));
}

// ── Shared pilot helpers: glossary, Simple/Detailed toggle, action handoff ──
var GLOSSARY={"tonic":"The home chord or note — where the music feels at rest.","subdominant":"Harmony that pulls away from home and sets up tension (the IV side).","dominant":"The tension chord that wants to fall back to the tonic (the V).","borrowed":"A chord taken from the parallel major/minor for extra color.","secondary dominant":"A V chord aimed at a chord other than the tonic, briefly making it feel like home.","syncopation":"Accents landing off the strongest beats, giving a pushed, lively feel.","voice leading":"How each line moves note-to-note from one chord to the next.","parallel fifths":"Two voices a 5th apart moving the same direction — the classic counterpoint no-no.","parallel octaves":"Two voices an octave apart moving together, collapsing two lines into one.","hidden fifth":"Both voices leap the same direction into a 5th — a softer parallel-5th.","hidden octave":"Both voices leap the same direction into an octave.","contrary motion":"Two voices moving in opposite directions — the most independent, strongest motion.","oblique motion":"One voice holds while the other moves.","similar motion":"Two voices moving the same direction by different amounts.","parallel motion":"Two voices moving the same direction by the same interval.","density":"How many notes sound at once or in quick succession — how full it feels.","register":"How high or low the notes sit overall."};
var GLOSS_RE=new RegExp("\\b("+Object.keys(GLOSSARY).sort(function(a,b){return b.length-a.length;}).map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")\\b","gi");
function glossify(escaped){return String(escaped).replace(GLOSS_RE,function(m){var def=GLOSSARY[m.toLowerCase()];return def?'<span class="term" title="'+def.replace(/"/g,"&quot;")+'">'+m+'</span>':m;});}
(function(){var KEY="ta-detail";var saved="simple";try{saved=localStorage.getItem(KEY)||"simple";}catch(e){}if(saved==="detailed")document.body.classList.add("mode-detailed");var b=document.getElementById("detail-btn");if(b){b.textContent=saved==="detailed"?"Hide details":"Show details";b.addEventListener("click",function(){var on=!document.body.classList.contains("mode-detailed");document.body.classList.toggle("mode-detailed",on);try{localStorage.setItem(KEY,on?"detailed":"simple");}catch(e){}b.textContent=on?"Hide details":"Show details";});}})();
function sendNext(){var msg={method:"close_and_send",params:["__OPEN_WHATNEXT__"]};if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.live)window.webkit.messageHandlers.live.postMessage(msg);else if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(msg);}
document.getElementById("next-link").addEventListener("click",sendNext);

// ── Header ────────────────────────────────────────────────────────────
document.getElementById("sub").textContent =
  "Bars " + bars(DATA.rangeStart) + " to " + bars(DATA.rangeEnd) + "  ·  " +
  DATA.trackNames.length + " track(s): " + DATA.trackNames.join(", ") +
  "  ·  " + DATA.noteCount + " notes";

var keysEl = document.getElementById("keys");
var keyHtml = '<span class="keybadge">' +
  (DATA.key.source === "live" ? "Live key: " : "Inferred key: ") +
  "<b>" + esc(DATA.key.label) + "</b></span>";
if (DATA.key.source === "live" && DATA.inferredAgrees === false && DATA.keyCandidates.length) {
  keyHtml += '<span class="keybadge mismatch">⚠ content suggests ' +
    esc(DATA.keyCandidates[0].label) + "</span>";
}
if (DATA.modalColors && DATA.modalColors.length) {
  keyHtml += DATA.modalColors.map(function(m) {
    return '<span class="keybadge">Modal color: <b>' + esc(m.mode) +
      '</b> ' + esc(m.note) + '</span>';
  }).join("");
}
keysEl.innerHTML = keyHtml;

document.getElementById("headline").innerHTML = glossify(esc(DATA.headline || ""));

function summarizeChords(items) {
  if (!items || !items.length) return "No clear chords";
  return items.slice(0, 5).join(", ") + (items.length > 5 ? ", more" : "");
}
function summarizeProgressions(items) {
  if (!items || !items.length) return "No named progression";
  return items.slice(0, 3).join(", ") + (items.length > 3 ? ", more" : "");
}

function renderRangeComparison() {
  var compare = DATA.rangeComparison;
  var el = document.getElementById("compare");
  if (!compare) return;

  function card(summary) {
    return '<div>' +
      '<div class="compare-title">' + esc(summary.label) + ' · bars ' +
        bars(summary.start) + ' to ' + bars(summary.end) + '</div>' +
      '<div class="compare-main">' + esc(summary.energy) +
        ' energy · tension ' + esc(summary.averageTension) +
        ' · density ' + esc(summary.averageDensity) + '</div>' +
      '<div class="compare-meta">Key: ' + esc(summary.impliedKey || "unclear") +
        ' · Role: ' + esc(summary.mainFunction || "unclear") + '</div>' +
      '<div class="compare-meta">' + esc(summarizeChords(summary.chordNames)) + '</div>' +
      '<div class="compare-meta">' + esc(summarizeProgressions(summary.progressions)) + '</div>' +
      '<div class="compare-meta">' +
        esc(summary.noteCount) + ' notes · ' +
        esc(summary.segmentCount) + ' segments · peak ' +
        esc(summary.peakTension) + '</div>' +
    '</div>';
  }

  var notes = compare.observations && compare.observations.length
    ? compare.observations
    : ["The two ranges are harmonically similar."];

  el.innerHTML =
    card(compare.first) +
    card(compare.second) +
    '<div><div class="compare-title">Comparison</div>' +
      '<ul class="compare-list">' +
        notes.map(function(note) { return '<li>' + glossify(esc(note)) + '</li>'; }).join("") +
      '</ul></div>';
  el.classList.add("show");
}
renderRangeComparison();

// ── Chord strip ───────────────────────────────────────────────────────
var PX_PER_BEAT = 26;
var stripEl = document.getElementById("strip");
var tensionEl = document.getElementById("tension");
var stripCells = [];

DATA.segments.forEach(function(s, idx) {
  var div = document.createElement("div");
  var dur = Math.max(s.end - s.start, 0.5);
  div.className = "seg" + (hasHardWarning(s) ? " clash" : "");
  div.style.width = Math.max(48, Math.round(dur * PX_PER_BEAT)) + "px";
  var fnClass = s.fn ? " fn-" + s.fn : "";
  div.innerHTML =
    (s.fn ? '<div class="fnbar' + fnClass + '"></div>' : "") +
    '<div class="chord">' + esc(s.chordName || "None") + "</div>" +
    '<div class="roman">' + esc(s.roman ? s.roman.label : "") + "</div>" +
    '<div class="beats">' + bars(s.start) + "</div>";
  div.addEventListener("click", function() {
    if (viewMode === "single") {
      var row = document.getElementById("rows").children[idx];
      if (row) row.scrollIntoView({ block: "center" });
    } else {
      var targetPage = Math.floor(idx / PAGE_SIZE);
      if (targetPage !== currentPage) { currentPage = targetPage; renderPage(); }
    }
  });
  stripEl.appendChild(div);
  stripCells.push(div);

  var t = document.createElement("div");
  t.className = "tension-cell";
  t.style.width = div.style.width;
  t.style.background = s.tension >= 70 ? "var(--warn)" : s.tension >= 35 ? "var(--dom)" : "var(--tonic)";
  t.style.opacity = String(0.25 + Math.min(100, s.tension || 0) / 135);
  t.title = "Tension " + (s.tension || 0) + " of 100, density " + (s.density || 0);
  tensionEl.appendChild(t);
});

// ── Table + pagination ────────────────────────────────────────────────
var totalPages = Math.max(1, Math.ceil(DATA.segments.length / PAGE_SIZE));

function renderPage() {
  var tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  var single = viewMode === "single";
  var pageStart = single ? 0 : currentPage * PAGE_SIZE;
  var pageEnd   = single ? DATA.segments.length
                         : Math.min(pageStart + PAGE_SIZE, DATA.segments.length);

  for (var i = pageStart; i < pageEnd; i++) {
    var s = DATA.segments[i];
    var tr = document.createElement("tr");
    var pills = "";
    if (s.roman && s.roman.borrowed)  pills += '<span class="pill borrowed">borrowed</span>';
    if (s.roman && s.roman.secondary) pills += '<span class="pill secondary">secondary dom.</span>';
    if (s.fn)                         pills += '<span class="pill fn">' + fnLabel(s.fn) + "</span>";
    var warn = s.outliers.length
      ? s.outliers.map(function(o) {
          var cls = o.severity === "warn" ? "warnline" : "infoline";
          return '<div class="' + cls + '">' + esc(o.name) + ": " +
                 esc(o.explanation || "Outside the key.") + ": " +
                 esc(o.tracks.join(", ")) + "</div>";
        }).join("")
      : '<span class="dimtext">None</span>';
    tr.innerHTML =
      "<td>" + bars(s.start) + " to " + bars(s.end) + "</td>" +
      "<td><b>" + esc(s.chordName || "None") + "</b></td>" +
      '<td class="roman">' + esc(s.roman ? s.roman.label : "") + "</td>" +
      "<td>" + pills + "</td>" +
      '<td class="dimtext">' + esc(s.pcNames.join(" ")) + "</td>" +
      "<td>" + warn + "</td>";
    tbody.appendChild(tr);
  }

  var pager = document.getElementById("pager");
  var multi = totalPages > 1;
  // Show the pager whenever paging is possible; the toggle stays available so
  // long timelines can switch to one continuous, scrollable list.
  pager.style.display = multi ? "flex" : "none";
  document.getElementById("view-toggle").textContent = single ? "Paged view" : "Single view";
  ["prev", "next", "page-info", "pager-hint"].forEach(function(id) {
    document.getElementById(id).style.display = single ? "none" : "";
  });
  if (multi && !single) {
    document.getElementById("page-info").textContent =
      "Page " + (currentPage + 1) + " of " + totalPages +
      "  ·  segments " + (pageStart + 1) + " to " + pageEnd;
    document.getElementById("prev").disabled = currentPage === 0;
    document.getElementById("next").disabled = currentPage >= totalPages - 1;
  }

  stripCells.forEach(function(cell, idx) {
    var onPage = single ? false : (idx >= pageStart && idx < pageEnd);
    cell.classList.toggle("onpage", onPage);
    cell.classList.toggle("clash", hasHardWarning(DATA.segments[idx]));
  });
  if (!single && stripCells[pageStart]) {
    stripCells[pageStart].scrollIntoView({ inline: "start", block: "nearest" });
  }
}

function changePage(delta) {
  if (viewMode === "single") return;  // no pages to move through
  var next = currentPage + delta;
  if (next >= 0 && next < totalPages) { currentPage = next; renderPage(); }
}

document.getElementById("prev").addEventListener("click", function() { changePage(-1); });
document.getElementById("next").addEventListener("click", function() { changePage(1); });
document.getElementById("view-toggle").addEventListener("click", function() {
  viewMode = viewMode === "single" ? "paged" : "single";
  try { localStorage.setItem("ta-timeline-view", viewMode); } catch(e) {}
  renderPage();
});

var footerBits = [];
if (DATA.progressions && DATA.progressions.length) {
  footerBits.push("Progressions: " + DATA.progressions.map(function(p) {
    return p.pattern + " (" + p.label + ")";
  }).join("  ·  "));
}
if (DATA.resolutionSuggestions && DATA.resolutionSuggestions.length) {
  footerBits.push("Try next: " + DATA.resolutionSuggestions.map(function(s) {
    return s.label;
  }).join("  ·  "));
}
if (DATA.keyCandidates.length > 1) {
  footerBits.push("Also considered: " +
    DATA.keyCandidates.slice(1, 3).map(function(k) { return k.label; }).join("  ·  "));
}
document.getElementById("cands").textContent = footerBits.join("  ·  ");

renderPage();
</script>
</body>
</html>
