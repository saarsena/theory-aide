<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:     #181818;
    --panel:  #212121;
    --panel2: #272727;
    --line:   #2e2e2e;
    --line2:  #3a3a3a;
    --text:   #d8d8d8;
    --dim:    #888;
    --dim2:   #555;
    --accent: #ffaa2b;
    --ok:     #6fbf73;
    --warn:   #d4a017;
    --error:  #e0564f;
    --tonic:  #5b9bd5;
  }
  html[data-theme="light"] {
    --bg:     #f2f0ec;
    --panel:  #e8e6e2;
    --panel2: #dedbd7;
    --line:   #cac7c2;
    --line2:  #b0ada8;
    --text:   #1c1c1c;
    --dim:    #666;
    --dim2:   #888;
    --accent: #a06800;
    --ok:     #2a7a30;
    --warn:   #8a6800;
    --error:  #c02020;
    --tonic:  #1855a0;
  }
  html[data-theme="light"] .banner          { background: #fffbe8; border-color: #c89010; color: #7a5000; }
  html[data-theme="light"] .fchip.active    { background: #fff3d0; }
  html[data-theme="light"] .tag-error       { background: #ffe8e8; }
  html[data-theme="light"] .tag-warn        { background: #fff5d0; }
  html[data-theme="light"] .tag-ok          { background: #e8f5e8; }
  html[data-theme="light"] .detail-advice.adv-error { color: #c02020; }
  html[data-theme="light"] .detail-advice.adv-warn  { color: #8a6800; }
  html[data-theme="light"] button           { background: #dedad4; border-color: #b0ada8; }
  html[data-theme="light"] button:hover     { background: #d0ccc6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 14px 16px 12px; gap: 10px;
    overflow: hidden;
  }

  /* ── Header ── */
  .hd { flex-shrink: 0; }
  h1 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .sub { font-size: 11px; color: var(--dim); }
  .key-badge {
    display: inline-block; background: var(--panel);
    border: 1px solid var(--line2); border-radius: 4px;
    padding: 2px 8px; font-size: 11px; margin-top: 6px;
  }
  .key-badge b { color: var(--accent); }
  .no-key { font-size: 11px; color: var(--dim);
            border: 1px solid var(--line2); border-radius: 3px;
            display: inline-block; padding: 2px 8px; margin-top: 6px; }

  /* ── Summary bar ── */
  .summary {
    flex-shrink: 0;
    display: flex; gap: 6px; align-items: stretch;
  }
  .stat {
    flex: 1; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 5px; padding: 8px 10px; display: flex;
    flex-direction: column; gap: 2px;
  }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-lbl { font-size: 10px; color: var(--dim2);
              text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.s-error  .stat-num { color: var(--error); }
  .stat.s-warn   .stat-num { color: var(--warn); }
  .stat.s-ok     .stat-num { color: var(--ok); }
  .stat.s-total  .stat-num { color: var(--text); }

  /* ── Suggestion banner ── */
  .banner {
    flex-shrink: 0;
    background: #1e1a10; border: 1px solid #5c4a00; border-radius: 5px;
    padding: 8px 12px; font-size: 11.5px; color: #d4a017;
    display: none;
  }
  .banner b { font-weight: 600; }

  /* ── Filters ── */
  .filters {
    flex-shrink: 0; display: flex; gap: 5px; align-items: center;
  }
  .fchip {
    padding: 3px 10px; border-radius: 3px; font-size: 11px;
    border: 1px solid var(--line2); cursor: pointer;
    user-select: none; color: var(--dim);
  }
  .fchip:hover { border-color: var(--line); color: var(--text); }
  .fchip.active { border-color: var(--accent); color: var(--accent);
                  background: #251e10; }
  .filters-sep { color: var(--dim2); font-size: 11px; margin-left: 4px; }

  /* ── Results list ── */
  .results {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px;
  }
  .empty { color: var(--dim); font-size: 12px; text-align: center;
           padding: 24px; }

  .row {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 10px 6px;
    display: flex; align-items: flex-start; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .row:hover { border-color: var(--line2); }
  .row.expanded { border-color: var(--line2); background: var(--panel); }

  .sev-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0; margin-top: 5px;
  }
  .sev-error { background: var(--error); }
  .sev-warn  { background: var(--warn); }
  .sev-ok    { background: var(--ok); }

  .row-main { flex: 1; min-width: 0; }
  .row-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .row-clip  { font-size: 12.5px; font-weight: 600; }
  .row-track { font-size: 11px; color: var(--dim); }
  .row-loc   { font-size: 11px; color: var(--dim2); margin-left: auto; }

  .row-detail {
    display: none; margin-top: 7px; padding-top: 7px;
    border-top: 1px solid var(--line);
  }
  .row.expanded .row-detail { display: block; }
  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px;
    font-size: 11px;
  }
  .detail-grid dt { color: var(--dim2); }
  .detail-grid dd { color: var(--text); }
  .detail-advice {
    margin-top: 7px; font-size: 11px; color: var(--dim);
    border-left: 2px solid var(--line2); padding-left: 8px; line-height: 1.6;
  }
  .detail-advice.adv-error { border-color: var(--error); color: #f08080; }
  .detail-advice.adv-warn  { border-color: var(--warn); color: #c8a840; }

  .tag {
    display: inline-block; border-radius: 3px; padding: 0 5px;
    font-size: 10px; font-weight: 600;
  }
  .tag-error { background: #3a1010; color: var(--error); }
  .tag-warn  { background: #2d2010; color: var(--warn); }
  .tag-ok    { background: #102010; color: var(--ok); }

  /* ── Theme button ── */
  .theme-btn {
    background: transparent; border: 1px solid var(--line2);
    border-radius: 4px; padding: 3px 10px; font-size: 11px;
    cursor: pointer; color: var(--dim);
  }
  .theme-btn:hover { color: var(--text); border-color: var(--dim); }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0; display: flex; justify-content: space-between;
    align-items: center;
  }
  .footer-note { font-size: 10px; color: var(--dim2); }
  button {
    background: #2a2a2a; color: var(--text); border: 1px solid var(--line2);
    border-radius: 4px; padding: 5px 20px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #333; }
</style>
</head>
<body>

<div class="hd">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
    <h1 style="margin-bottom:0">Session Audit</h1>
    <button class="theme-btn" id="theme-btn">Light</button>
  </div>
  <div class="sub" id="sub"></div>
  <div id="keysrc"></div>
</div>

<div class="summary" id="summary"></div>
<div class="banner" id="banner"></div>

<div class="filters" id="filters">
  <span class="fchip active" data-sev="all">All</span>
  <span class="fchip" data-sev="error">Errors</span>
  <span class="fchip" data-sev="warn">Warnings</span>
  <span class="fchip" data-sev="ok">OK</span>
  <span class="filters-sep">|</span>
  <span class="fchip active" data-loc="all">Session + Arrangement</span>
  <span class="fchip" data-loc="session">Session only</span>
  <span class="fchip" data-loc="arrangement">Arrangement only</span>
</div>

<div class="results" id="results"></div>

<div class="footer">
  <span class="footer-note" id="footer-note"></span>
  <button id="close">Close</button>
</div>

<script>
var DATA = __AUDIT_JSON__;

// ── Theme toggle ──────────────────────────────────────────────────────────
(function() {
  var KEY = "ta-theme";
  var saved = "light";
  try { saved = localStorage.getItem(KEY) || "dark"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

function closeDialog() {
  var msg = { method: "close_and_send", params: ["null"] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live)
    window.webkit.messageHandlers.live.postMessage(msg);
  else if (window.chrome && window.chrome.webview)
    window.chrome.webview.postMessage(msg);
}
document.getElementById("close").addEventListener("click", closeDialog);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeDialog(); });

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Advice copy ────────────────────────────────────────────────────────────

function adviceFor(r) {
  if (r.severity === "ok") {
    if (!r.inferredKey) return "Clip has too few notes for key inference.";
    if (!DATA.scaleMode) return "Scale Mode is off: showing inferred key only.";
    return "Inferred key is compatible with the session key. No issues.";
  }
  if (r.severity === "warn") {
    if (r.outOfKeyPercent > 8) {
      return r.outOfKeyPercent + "% of notes fall outside " + (DATA.liveKey ? DATA.liveKey.label : "the key") +
        ". These may be intentional passing tones or chromatic decorations: " +
        "review the clip if you suspect unintended dissonance.";
    }
    return "Inferred key is closely related to the session key (e.g. relative major/minor, dominant). " +
      "The harmonic relationship is likely intentional, but worth confirming.";
  }
  // error
  if (!r.inferredKey) {
    return "Could not detect a clear key in this clip. It may contain very sparse " +
      "or highly chromatic content: check for accidental notes or stray MIDI.";
  }
  if (r.outOfKeyPercent > 25) {
    return r.outOfKeyPercent + "% of notes fall outside " +
      (DATA.liveKey ? DATA.liveKey.label : "the session key") +
      ". This clip is likely in a different key than the session. " +
      "If intentional (key change, modulation), consider updating Live's Scale Mode to match.";
  }
  return "The inferred key (" + r.inferredKey + ") is far from the session key " +
    "(" + (DATA.liveKey ? DATA.liveKey.label : "unknown") + ") on the circle of fifths. " +
    "These keys are harmonically distant and will clash when played together.";
}

// ── Render ─────────────────────────────────────────────────────────────────

var activeSev = "all";
var activeLoc = "all";

document.getElementById("sub").textContent =
  DATA.analyzedClips + " clip" + (DATA.analyzedClips !== 1 ? "s" : "") +
  " analyzed" +
  (DATA.scannedClips !== DATA.analyzedClips
    ? " (" + DATA.scannedClips + " scanned)" : "");

// Key badge
(function() {
  var el = document.getElementById("keysrc");
  if (DATA.scaleMode && DATA.liveKey) {
    el.innerHTML = '<span class="key-badge">Session key: <b>' +
      esc(DATA.liveKey.label) + '</b></span>';
  } else {
    el.innerHTML = '<span class="no-key">Scale Mode off: showing inferred keys only</span>';
  }
})();

// Summary stats
(function() {
  var s = DATA.summary;
  var el = document.getElementById("summary");
  el.innerHTML =
    '<div class="stat s-total"><div class="stat-num">' + DATA.analyzedClips + '</div>' +
    '<div class="stat-lbl">Clips</div></div>' +
    '<div class="stat s-error"><div class="stat-num">' + s.errorCount + '</div>' +
    '<div class="stat-lbl">Errors</div></div>' +
    '<div class="stat s-warn"><div class="stat-num">' + s.warnCount + '</div>' +
    '<div class="stat-lbl">Warnings</div></div>' +
    '<div class="stat s-ok"><div class="stat-num">' + s.okCount + '</div>' +
    '<div class="stat-lbl">OK</div></div>';
})();

// Suggestion banner (dominant key ≠ Live key)
(function() {
  if (!DATA.dominantInferredKey || !DATA.liveKey) return;
  if (DATA.dominantInferredKey === DATA.liveKey.label) return;
  var el = document.getElementById("banner");
  el.style.display = "block";
  el.innerHTML =
    '<b>Suggestion:</b> Most clips suggest the key is <b>' +
    esc(DATA.dominantInferredKey) + '</b>, but Live\'s Scale Mode is set to <b>' +
    esc(DATA.liveKey.label) + '</b>. ' +
    'If this session is in ' + esc(DATA.dominantInferredKey) +
    ', updating the Live key will make the audit more accurate and sync Theory Aide with Scaler.';
})();

// Filters
document.querySelectorAll(".fchip[data-sev]").forEach(function(chip) {
  chip.addEventListener("click", function() {
    document.querySelectorAll(".fchip[data-sev]").forEach(function(c) {
      c.classList.remove("active");
    });
    chip.classList.add("active");
    activeSev = chip.dataset.sev;
    renderResults();
  });
});
document.querySelectorAll(".fchip[data-loc]").forEach(function(chip) {
  chip.addEventListener("click", function() {
    document.querySelectorAll(".fchip[data-loc]").forEach(function(c) {
      c.classList.remove("active");
    });
    chip.classList.add("active");
    activeLoc = chip.dataset.loc;
    renderResults();
  });
});

function renderResults() {
  var container = document.getElementById("results");
  container.innerHTML = "";

  var filtered = DATA.results.filter(function(r) {
    if (activeSev !== "all" && r.severity !== activeSev) return false;
    if (activeLoc === "session" && r.isArrangement) return false;
    if (activeLoc === "arrangement" && !r.isArrangement) return false;
    return true;
  });

  // Sort: errors → warnings → ok
  var order = { error: 0, warn: 1, ok: 2 };
  filtered.sort(function(a, b) {
    return (order[a.severity] || 0) - (order[b.severity] || 0);
  });

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">No issues found with current filters.</div>';
    return;
  }

  document.getElementById("footer-note").textContent =
    "Showing " + filtered.length + " of " + DATA.results.length + " clips";

  filtered.forEach(function(r, rowIdx) {
    var row = document.createElement("div");
    row.className = "row";

    var loc = r.isArrangement
      ? "Arrangement"
      : (r.sceneName || ("Scene " + ((r.sceneIndex || 0) + 1)));

    var tagClass = r.severity === "error" ? "tag-error"
                 : r.severity === "warn"  ? "tag-warn" : "tag-ok";
    var tagLabel = r.severity === "error" ? "ERROR"
                 : r.severity === "warn"  ? "WARN" : "OK";

    var outLine = DATA.scaleMode && r.outOfKeyPercent > 0
      ? r.outOfKeyPercent + "% out of key"
      : (r.inferredKey ? "key: " + r.inferredKey : "no key detected");

    var advice = adviceFor(r);
    var advClass = r.severity === "error" ? "adv-error"
                 : r.severity === "warn"  ? "adv-warn" : "";

    row.innerHTML =
      '<div class="sev-dot sev-' + r.severity + '"></div>' +
      '<div class="row-main">' +
        '<div class="row-head">' +
          '<span class="row-clip">' + esc(r.clipName) + '</span>' +
          '<span class="row-track">' + esc(r.trackName) + '</span>' +
          '<span class="tag ' + tagClass + '">' + tagLabel + '</span>' +
          '<span class="row-loc">' + esc(loc) + '</span>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--dim);margin-top:2px">' +
          esc(outLine) +
        '</div>' +
        '<div class="row-detail">' +
          '<div class="detail-grid">' +
            '<dt>Inferred key</dt><dd>' + esc(r.inferredKey || "None") + '</dd>' +
            (DATA.liveKey
              ? '<dt>Session key</dt><dd>' + esc(DATA.liveKey.label) + '</dd>'
              : '') +
            '<dt>Notes out of key</dt><dd>' +
              (DATA.scaleMode
                ? r.outOfKeyCount + ' / ' + r.noteCount + ' (' + r.outOfKeyPercent + '%)'
                : 'None') +
            '</dd>' +
            '<dt>Location</dt><dd>' + esc(loc) + ' · ' +
              (r.isArrangement ? "Arrangement" : "Session") + '</dd>' +
          '</div>' +
          '<div class="detail-advice ' + advClass + '">' + esc(advice) + '</div>' +
        '</div>' +
      '</div>';

    row.addEventListener("click", function() {
      row.classList.toggle("expanded");
    });

    container.appendChild(row);
  });
}

renderResults();
</script>
</body>
</html>
