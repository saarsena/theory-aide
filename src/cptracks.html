<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counterpoint · Choose Tracks</title>
<script>
// Blocking: set the saved theme before any CSS paints (prevents a dark flash).
(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ta-theme")||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<style>
:root {
  --bg:#181818; --panel:#212121; --panel2:#272727; --line:#2e2e2e; --line2:#3a3a3a;
  --text:#d8d8d8; --dim:#888; --dim2:#555; --accent:#ffaa2b; --warn:#e0564f;
  --ok:#6fbf73; --info:#5b9bd5;
}
html[data-theme="light"] {
  --bg:#f2f0ec; --panel:#e8e6e2; --panel2:#dedbd7; --line:#cac7c2; --line2:#b0ada8;
  --text:#1c1c1c; --dim:#666; --dim2:#888; --accent:#a06800; --warn:#c02020;
  --ok:#2a7a30; --info:#1855a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
       font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.hdr { padding: 12px 14px 0; display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.hdr-title { font-size: 15px; font-weight: 600; }
.hdr-sub { color: var(--dim); font-size: 11px; flex: 1; }
.hdr-btn { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2);
           border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
.hdr-btn:hover { color: var(--text); }
.intro { padding: 6px 14px 0; color: var(--dim); font-size: 11px; line-height: 1.5; }
.toolbar { padding: 8px 14px; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.tool-btn { background: var(--panel); border: 1px solid var(--line2); border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 11px; color: var(--dim); }
.tool-btn:hover { color: var(--text); border-color: var(--accent); }
.list { flex: 1; overflow-y: auto; padding: 0 14px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 5px;
       border: 1px solid transparent; cursor: pointer; }
.row:hover { background: var(--panel); }
.row input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.row-main { flex: 1; min-width: 0; }
.row-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 10px; color: var(--dim); margin-top: 1px; }
.perc-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 8px;
            font-size: 9px; font-weight: 600; background: rgba(224,86,79,.16); color: var(--warn);
            border: 1px solid rgba(224,86,79,.3); }
.footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; align-items: center;
          gap: 10px; flex-shrink: 0; }
.pair-count { font-size: 11px; color: var(--dim); flex: 1; }
.btn { border-radius: 5px; padding: 7px 16px; cursor: pointer; font-size: 12px; font-weight: 600; border: 1px solid var(--line2); }
.btn-cancel { background: var(--panel); color: var(--dim); }
.btn-cancel:hover { color: var(--text); }
.btn-go { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
.btn-go:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">Choose Tracks to Compare</div>
  <div class="hdr-sub" id="sub-line"></div>
  <button class="hdr-btn" id="theme-btn">Light</button>
</div>
<div class="intro">
  Counterpoint compares every pair of tracks, and every MIDI note counts, even
  unpitched percussion. Deselect drum/percussion and any track you don't want in
  the analysis. Tracks that look like percussion are pre-unchecked.
</div>
<div class="toolbar">
  <button class="tool-btn" id="sel-all">Select all</button>
  <button class="tool-btn" id="sel-none">Select none</button>
  <button class="tool-btn" id="sel-melodic">Melodic only</button>
</div>
<div class="list" id="list"></div>
<div class="footer">
  <div class="pair-count" id="pair-count"></div>
  <button class="btn btn-cancel" id="cancel">Cancel</button>
  <button class="btn btn-go" id="analyze">Analyze</button>
</div>

<script>
(function() {
  var KEY = "ta-theme", saved = "light";
  try { saved = localStorage.getItem(KEY) || "light"; } catch(e) {}
  document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("theme-btn");
  btn.textContent = saved === "dark" ? "Light" : "Dark";
  btn.addEventListener("click", function() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch(e) {}
    btn.textContent = next === "dark" ? "Light" : "Dark";
  });
})();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function send(payload) {
  var m = { method: "close_and_send", params: [JSON.stringify(payload)] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live)
    window.webkit.messageHandlers.live.postMessage(m);
  else if (window.chrome && window.chrome.webview)
    window.chrome.webview.postMessage(m);
}

var DATA = __CPTRACKS_JSON__;

// Optional copy overrides so the same picker serves Counterpoint and Timeline.
var MIN = DATA.minSelect || 2;
var COUNT = DATA.countMode || "pairs";
if (DATA.title)   document.querySelector(".hdr-title").textContent = DATA.title;
if (DATA.intro)   document.querySelector(".intro").textContent = DATA.intro;
if (DATA.goLabel) document.getElementById("analyze").textContent = DATA.goLabel;

document.getElementById("sub-line").textContent =
  "b" + DATA.rangeStart.toFixed(2) + "–b" + DATA.rangeEnd.toFixed(2);

var listEl = document.getElementById("list");
DATA.tracks.forEach(function(t) {
  var row = document.createElement("label");
  row.className = "row";
  var checked = t.likelyPerc ? "" : "checked";
  row.innerHTML =
    '<input type="checkbox" data-key="' + esc(t.key) + '" ' + checked + '>' +
    '<div class="row-main">' +
      '<div class="row-name">' + esc(t.name) +
        (t.likelyPerc ? '<span class="perc-tag">percussion?</span>' : '') + '</div>' +
      '<div class="row-meta">' + t.noteCount + ' notes · ' +
        esc(t.lowName) + '–' + esc(t.highName) + ' · ' + t.distinctPCs + ' pitch classes</div>' +
    '</div>';
  listEl.appendChild(row);
});

function checkboxes() { return Array.prototype.slice.call(listEl.querySelectorAll("input")); }
function selectedKeys() {
  return checkboxes().filter(function(c){return c.checked;}).map(function(c){return c.dataset.key;});
}

function refresh() {
  var n = selectedKeys().length;
  var el = document.getElementById("pair-count");
  if (COUNT === "pairs") {
    var pairs = n * (n - 1) / 2;
    el.textContent = n + " track" + (n === 1 ? "" : "s") + " selected · " +
                     pairs + " pair" + (pairs === 1 ? "" : "s");
    if (pairs > 120) el.textContent += " (over 120: will be truncated)";
  } else {
    el.textContent = n + " track" + (n === 1 ? "" : "s") + " selected";
  }
  document.getElementById("analyze").disabled = n < MIN;
}

listEl.addEventListener("change", refresh);

document.getElementById("sel-all").addEventListener("click", function() {
  checkboxes().forEach(function(c){ c.checked = true; }); refresh();
});
document.getElementById("sel-none").addEventListener("click", function() {
  checkboxes().forEach(function(c){ c.checked = false; }); refresh();
});
document.getElementById("sel-melodic").addEventListener("click", function() {
  checkboxes().forEach(function(c, i){ c.checked = !DATA.tracks[i].likelyPerc; }); refresh();
});

document.getElementById("cancel").addEventListener("click", function() { send(null); });
document.getElementById("analyze").addEventListener("click", function() {
  var keys = selectedKeys();
  if (keys.length >= MIN) send(keys);
});

refresh();
</script>
</body>
</html>
